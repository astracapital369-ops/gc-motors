<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GC Motors</title>
<meta name="theme-color" content="#0f1d3d">
<meta name="apple-mobile-web-app-title" content="GC Motors">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="icon" type="image/png" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* GC Motors : marine profond + bleu signal + chrome. Barre latérale sur PC, barre de marque + onglets en bas sur téléphone. */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --surface-2:#eceef2; --line:#d9dce3;
  --ink:#141a28; --muted:#5a6377; --accent:#2a5ff0; --brand:#0f1d3d; --brand-ink:#eef2fa; --accent-ink:#ffffff; --accent-soft:#e4ebfd;
  --good:#1d7a46; --good-soft:#e1f2e8; --warn:#9a5b00; --warn-soft:#fbefd9; --bad:#b42318; --bad-soft:#fbe4e2;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1115; --surface:#171a20; --surface-2:#1f232b; --line:#2c313b;
  --ink:#eceef2; --muted:#9aa1ad; --accent:#6f97ff; --accent-ink:#0b1020; --brand:#0b1430; --brand-ink:#eef2fa; --accent-soft:#1c2744;
  --good:#4cc283; --good-soft:#15291e; --warn:#e8a83a; --warn-soft:#2c2212; --bad:#ff7b6e; --bad-soft:#331a18; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1115; --surface:#171a20; --surface-2:#1f232b; --line:#2c313b;
  --ink:#eceef2; --muted:#9aa1ad; --accent:#6f97ff; --accent-ink:#0b1020; --brand:#0b1430; --brand-ink:#eef2fa; --accent-soft:#1c2744;
  --good:#4cc283; --good-soft:#15291e; --warn:#e8a83a; --warn-soft:#2c2212; --bad:#ff7b6e; --bad-soft:#331a18; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:30px;line-height:1.1} h2{font-size:21px} h3{font-size:17px}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100%}
nav.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 16px}
.brand svg{width:42px;height:42px;flex:none;border-radius:10px}
.brand .wm{font-family:var(--display);font-weight:700;font-size:23px;line-height:1;letter-spacing:.02em;white-space:nowrap}
.brand .wm em{font-style:normal;color:var(--accent)}
.brand .wm span{display:block;font:600 9.5px var(--body);letter-spacing:.22em;color:var(--muted);margin-top:3px}
.mbar{display:none}

.dd{border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.dd summary{list-style:none;cursor:pointer;padding:11px 40px 11px 12px;position:relative;font-weight:500}
.dd summary::-webkit-details-marker{display:none}
.dd summary::after{content:"";position:absolute;right:14px;top:50%;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);transition:transform .15s}
.dd[open] summary::after{transform:translateY(-30%) rotate(-135deg)}
.ddlist{border-top:1px solid var(--line);max-height:380px;overflow-y:auto;padding:6px 0}
.ddg{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:10px 12px 4px}
.ck{display:flex;align-items:center;gap:10px;padding:7px 12px;font-size:14.5px;cursor:pointer}
.ck input[type=checkbox]{width:19px;height:19px;accent-color:var(--accent);flex:none}
.ck.fr label{display:flex;align-items:center;gap:10px;flex:1;cursor:pointer;min-width:0}
.ck .amt{width:80px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);text-align:right;font-size:14px}
.ck .amt:disabled{opacity:.45}
.ck .eu{color:var(--muted);font-size:13px}
.sstep{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sstep h2{margin:0}
.sn{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font-size:12.5px;font-weight:500}
.tile .mono{width:38px;height:38px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:16px;color:var(--muted)}
.tile.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.tile.on .mono{background:var(--accent);color:var(--accent-ink)}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px}
.stepper button{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);font-size:26px;cursor:pointer;color:var(--ink)}
.stepper div{text-align:center;min-width:110px}
.stepper b{font-family:var(--display);font-size:44px;line-height:1;display:block}
.stepper small{color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent);padding:0!important;border:none!important;background:none!important;margin-top:6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1;min-width:90px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font-size:13px;font-weight:500}
.seg button span{font-size:18px}
.seg button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.etats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.etat{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.etat small{color:var(--muted);font-size:12px}
.etat.on{border-color:var(--accent);background:var(--accent-soft)}
.btn.big{padding:14px;font-size:17px;justify-content:center;width:100%}
.est .mid{background:var(--accent-soft)}
.est .mid b{color:var(--accent)}
.range{position:relative;height:8px;background:var(--surface-2);border-radius:4px;margin:12px 4px 4px}
.range i{position:absolute;top:0;bottom:0;background:var(--accent);opacity:.35;border-radius:4px}
.range span{position:absolute;top:-4px;width:4px;height:16px;margin-left:-2px;background:var(--accent);border-radius:2px}
.buybox{margin-top:14px;padding:14px;border-radius:10px;background:var(--surface-2)}
.buybox small{color:var(--muted);font-size:13px}
.buybox .big{font-family:var(--display);font-size:40px;font-weight:600;line-height:1.1;color:var(--accent)}
.verdict{margin-top:12px;padding:12px;border-radius:10px;border-left:4px solid var(--warn);background:var(--warn-soft);display:flex;flex-direction:column;gap:2px}
.verdict.good{border-color:var(--good);background:var(--good-soft)}
.verdict.bad{border-color:var(--bad);background:var(--bad-soft)}
.verdict b{font-size:16px}

.car{overflow:hidden}
.car .cover{margin:-16px -16px 0;aspect-ratio:16/10;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--muted);overflow:hidden}
.car .cover img{width:100%;height:100%;object-fit:cover;display:block}
.car .cover svg{width:56px;height:56px;opacity:.45}
.car .cover .count{position:absolute}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--surface-2);border:none;padding:0;cursor:zoom-in}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .tag{position:absolute;left:4px;top:4px;background:var(--accent);color:var(--accent-ink);font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:4px}
.addph{aspect-ratio:1;border:1.5px dashed var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:12.5px;cursor:pointer;background:none}
.addph:hover{border-color:var(--accent);color:var(--accent)}
.addph b{font-size:24px;line-height:1;font-weight:400}
.lb{position:fixed;inset:0;background:#05080f;z-index:70;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom))}
.lb .lbbar{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#fff;font-size:14px}
.lb .lbbar .acts{display:flex;gap:6px;flex-wrap:wrap}
.lb button{background:rgba(255,255,255,.12);color:#fff;border:none;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:14px}
.lb button.del{background:rgba(255,90,80,.25)}
.lb .lbbar{position:relative;z-index:2;padding-bottom:8px}
.lb .img{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:pan-y}
.lb .img img{position:absolute;inset:0;margin:auto;max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.lb .nav{position:absolute;z-index:2;top:50%;transform:translateY(-50%);font-size:26px;padding:10px 14px}
.lb .prev{left:4px}.lb .next{right:4px}
.login{max-width:420px;margin:6vh auto 0;display:flex;flex-direction:column;gap:16px}
.login .logo-big svg{width:88px;height:88px;border-radius:20px;display:block;margin:0 auto}
.login h1{text-align:center}
.login p{text-align:center;color:var(--muted);margin:0}
.login form{display:flex;flex-direction:column;gap:12px}
.login .err{color:var(--bad);font-size:14px;min-height:1em;text-align:center}
.linkbtn{background:none;border:none;color:var(--accent);cursor:pointer;padding:4px;font-weight:500}
.install{display:grid;grid-template-columns:120px 1fr;gap:18px;align-items:start}
.install svg{width:120px;height:120px;border-radius:26px;box-shadow:0 6px 18px rgba(10,18,38,.25)}
.install ol{margin:6px 0 12px;padding-left:20px}
.install li{margin:3px 0}
.navlink{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500}
.navlink svg{width:18px;height:18px;flex:none}
.navlink:hover{background:var(--surface-2)}
.navlink.on{background:var(--accent-soft);color:var(--accent)}
.side .status{margin-top:auto;font-size:12px;color:var(--muted);padding:10px}
main{padding:24px 28px 40px;max-width:1180px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top p{margin:4px 0 0;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card > h2{margin-bottom:12px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi .lbl{font-size:13px;color:var(--muted)}
.kpi .val{font-family:var(--display);font-size:32px;font-weight:600;line-height:1.1;margin-top:4px}
.kpi .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.two{grid-template-columns:1.4fr 1fr}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-reperage{background:var(--surface-2);color:var(--muted)}
.st-achete{background:var(--accent-soft);color:var(--accent)}
.st-preparation{background:var(--warn-soft);color:var(--warn)}
.st-en_vente{background:var(--good-soft);color:var(--good)}
.st-vendu{background:var(--surface-2);color:var(--ink)}
.demo-tag{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--warn)}
.banner{border:1px dashed var(--warn);background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.info{border-color:var(--line);background:var(--surface-2)}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;border-left:3px solid var(--warn);background:var(--warn-soft);text-decoration:none;color:var(--ink)}
.alert.bad{border-color:var(--bad);background:var(--bad-soft)}
.alert.ok{border-color:var(--good);background:var(--good-soft)}
.alert small{color:var(--muted);display:block}
.pipeline{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pipe{background:var(--surface-2);border-radius:8px;padding:10px;text-decoration:none;color:var(--ink)}
.pipe b{font-family:var(--display);font-size:26px;display:block;line-height:1}
.pipe span{font-size:12.5px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.search{flex:1;min-width:180px;max-width:320px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.car{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--ink);transition:border-color .15s}
.car:hover{border-color:var(--accent)}
.car .hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.car .name{font-family:var(--display);font-size:21px;font-weight:600;line-height:1.1}
.car .meta{font-size:13px;color:var(--muted)}
.car .figs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;border-top:1px solid var(--line);padding-top:10px}
.car .figs div{font-size:12px;color:var(--muted)}
.car .figs b{display:block;font-size:15px;color:var(--ink);font-weight:600}
.bar{height:5px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.plate{font-family:var(--mono);font-size:11px;letter-spacing:.08em;border:1.5px solid var(--bad);color:var(--bad);border-radius:3px;padding:0 4px;background:var(--surface)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
label.f input,label.f select,label.f textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:15px;width:100%}
label.f textarea{min-height:80px;resize:vertical}
input:disabled,select:disabled,textarea:disabled{opacity:.7}
.calc{display:flex;flex-direction:column;gap:6px}
.calc .row{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.calc .row span:first-child{color:var(--muted)}
.calc .total{border-top:1px solid var(--line);padding-top:8px;margin-top:4px;font-weight:600;font-size:16px}
.calc .big{font-family:var(--display);font-size:36px;font-weight:600;line-height:1}
.frais{width:100%;border-collapse:collapse;font-size:14px}
.frais td,.frais th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.frais th{font-size:12px;color:var(--muted);font-weight:500}
.frais input,.frais select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.x{border:none;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:4px 6px}
.x:hover{color:var(--bad)}
.check{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px}
.check label{display:flex;gap:8px;align-items:center;font-size:14px;padding:4px 0;cursor:pointer}
.check input{width:17px;height:17px;accent-color:var(--accent)}
.check h3{grid-column:1/-1;font-size:14px;color:var(--muted);font-family:var(--body);font-weight:600;margin-top:8px;text-transform:uppercase;letter-spacing:.05em}
.fiche{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px}
.sticky{position:sticky;top:16px}
.est{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.est div{background:var(--surface-2);border-radius:8px;padding:8px}
.est small{display:block;color:var(--muted);font-size:12px}
.est b{font-family:var(--display);font-size:22px}
.note{font-size:12.5px;color:var(--muted)}
.tablewrap{overflow-x:auto}
table.data{width:100%;border-collapse:collapse;font-size:14px;min-width:720px}
table.data th,table.data td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.data th:first-child,table.data td:first-child{text-align:left}
table.data th{font-size:12px;color:var(--muted);font-weight:500}
table.data tfoot td{font-weight:600;border-top:2px solid var(--line)}
table.data a{color:var(--ink);font-weight:500}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--body)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .card{max-width:420px;width:100%}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;max-width:90vw}
nav.tabs{display:none}
@media (max-width:760px){.install{grid-template-columns:1fr}}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
@media (max-width:980px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.two,.fiche{grid-template-columns:1fr}.sticky{position:static}.fiche .sticky{order:-1}}
@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  nav.side{display:none}
  .mbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;background:var(--brand);color:var(--brand-ink);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top))}
  .mbar svg{width:32px;height:32px;border-radius:8px}
  .mbar .wm{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.02em;line-height:1}
  .mbar .wm em{font-style:normal;color:#8fb0ff}
  .mbar .wm span{font:600 10px var(--body);letter-spacing:.28em;opacity:.7;margin-left:6px}
  main{padding:16px 16px calc(96px + env(safe-area-inset-bottom))}

/* ---------- photos ---------- */
let photoCol=null,idb=null;
const photoCache={};
function idbOpen(){if(idb)return Promise.resolve(idb);return new Promise((res,rej)=>{const r=indexedDB.open("gc-photos",1);r.onupgradeneeded=()=>{const st=r.result.createObjectStore("photos",{keyPath:"id"});st.createIndex("vehicleId","vehicleId")};r.onsuccess=()=>{idb=r.result;res(idb)};r.onerror=()=>rej(r.error)})}
async function photosFor(vid){
  if(S.mode==="db"&&photoCol){const q=await photoCol.where("vehicleId","==",vid).get();return q.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0))}
  const d=await idbOpen();return new Promise(res=>{const t=d.transaction("photos").objectStore("photos").index("vehicleId").getAll(vid);t.onsuccess=()=>res((t.result||[]).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)));t.onerror=()=>res([])});
}
async function savePhoto(p){
  if(S.mode==="db"&&photoCol){const data={...p};delete data.id;await photoCol.doc(p.id).set(data);return}
  const d=await idbOpen();await new Promise((res,rej)=>{const t=d.transaction("photos","readwrite");t.objectStore("photos").put(p);t.oncomplete=res;t.onerror=()=>rej(t.error)});
}
async function deletePhoto(id){
  if(S.mode==="db"&&photoCol){await photoCol.doc(id).delete();return}
  const d=await idbOpen();await new Promise(res=>{const t=d.transaction("photos","readwrite");t.objectStore("photos").delete(id);t.oncomplete=res;t.onerror=res});

function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{res(i);setTimeout(()=>URL.revokeObjectURL(u),1000)};i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("image"))};i.src=u})}
function shrink(img,max,q){const r=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*r),h=Math.round(img.naturalHeight*r);const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);let out=c.toDataURL("image/jpeg",q);while(out.length>850000&&q>0.4){q-=0.1;out=c.toDataURL("image/jpeg",q)}return out}
async function addPhotos(v,files){

  const list=photoCache[v.id]||(photoCache[v.id]=await photosFor(v.id));

  for(const f of files){
    try{const img=await loadImg(f);const p={id:newId(),vehicleId:v.id,full:shrink(img,1400,0.78),thumb:shrink(img,360,0.72),createdAt:Date.now()};
      await savePhoto(p);list.push(p);ok++;
      if(!v.cover){v.cover=p.thumb;v.coverId=p.id}
    }catch(e){toast(e&&e.code==="resource-exhausted"?"Quota de stockage atteint.":"Une photo n'a pas pu être ajoutée.")}
  }
  v.photoCount=list.length;persistVehicle(v,true);
  if(ok)toast(ok+" photo"+(ok>1?"s":"")+" ajoutée"+(ok>1?"s":"")+".");
  render();
}

    (v.demo?"":'<label class="addph" for="phinput"><b>+</b>Ajouter</label>');
}
let lbIdx=0;
function openLb(v,i){
  const list=photoCache[v.id]||[];if(!list.length)return;lbIdx=(i+list.length)%list.length;const p=list[lbIdx];

    '<div class="img"><img src="'+p.full+'" alt="Photo '+(lbIdx+1)+'">'+(list.length>1?'<button class="nav prev" data-lb="prev" aria-label="Précédente">‹</button><button class="nav next" data-lb="next" aria-label="Suivante">›</button>':"")+'</div></div>';
  const ov=$("#overlay");

}

let auth=null,unsubs=[];
function fbReady(){const c=window.FIREBASE_CONFIG;return !!(window.firebase&&c&&c.apiKey&&!/COLLE/i.test(c.apiKey))}
async function boot(){
  render();
  if(!fbReady()){S.mode="local";lsLoad();S.loaded=true;render();return}
  firebase.initializeApp(window.FIREBASE_CONFIG);
  auth=firebase.auth();db=firebase.firestore();
  try{await db.enablePersistence({synchronizeTabs:true})}catch(e){}
  auth.onAuthStateChanged(u=>{
    unsubs.forEach(f=>f());unsubs=[];
    if(!u){
      if(localStorage.getItem("gc-local")==="1"){S.mode="local";lsLoad();S.loaded=true;render();return}
      S.mode="login";S.loaded=true;S.vehicles=[];render();return}
    uid=u.uid;S.email=u.email;S.mode="db";S.loaded=false;render();
    const base=db.collection("users").doc(uid);
    vehCol=base.collection("vehicles");photoCol=base.collection("photos");setRef=base.collection("meta").doc("settings");
    let gotV=false;
    const timer=setTimeout(()=>{if(!gotV){S.loaded=true;S.mode="db-slow";render()}},10000);
    unsubs.push(vehCol.onSnapshot(snap=>{
      const remote=snap.docs.map(d=>({...d.data(),id:d.id}));
      S.vehicles=remote.map(r=>{const loc=S.vehicles.find(x=>x.id===r.id);return(loc&&timers[r.id]&&loc.updatedAt>(r.updatedAt||0))?loc:r});
      S.vehicles.forEach(v=>{if(!v.frais)v.frais=[];if(!v.check)v.check={}});
      if(!snap.metadata.fromCache){gotV=true;clearTimeout(timer);if(S.mode==="db-slow")S.mode="db"}
      S.loaded=true;if(!editing())render();
    },e=>{clearTimeout(timer);S.loaded=true;S.mode="db-error";render()}));
    unsubs.push(setRef.onSnapshot(d=>{if(d.exists){S.settings={...DEF_SETTINGS,...d.data()};if(!editing())render()}},()=>{}));
  });
}

function modeText(){return{login:"Non connecté",loading:"Connexion…",db:"Synchronisé"+(S.email?" · "+S.email:""),local:"Données sur cet appareil uniquement","db-slow":"Synchronisation lente : données peut-être pas à jour","db-error":"Synchronisation interrompue : recharge la page"}[S.mode]||""}

function render(){

  if(!S.loaded){app.innerHTML='<p class="note">Chargement de ton garage…</p>';return}
  if(S.mode==="login"){app.innerHTML=vLogin();return}
  let h="";
  if(S.mode==="local")h+='<div class="banner info"><span>Tes données sont enregistrées sur cet appareil seulement.'+(fbReady()?' Connecte-toi pour les synchroniser entre ton téléphone et ton PC.</span><button class="btn small" data-act="gologin">Se connecter</button>':'</span>')+'</div>';
  if(S.mode==="db-error"||S.mode==="db-slow")h+='<div class="banner"><span>'+modeText()+'</span></div>';
  if(showingDemo()&&r.view!=="reglages")h+='<div class="banner"><span><b>Exemples affichés.</b> Ces 4 voitures montrent comment l\'app fonctionne. Elles disparaissent dès que tu ajoutes ta première voiture.</span><button class="btn primary small" data-act="add">Ajouter ma première voiture</button></div>';

/* ---------- tableau de bord ---------- */
function vTableau(){
  const L=list(),stock=L.filter(v=>EN_STOCK.includes(v.statut)),vendus=L.filter(v=>v.statut==="vendu");
  const cy=new Date().getFullYear();
  if(!S.period)S.period={y:cy,m:""};
  const y=S.period.y,pm=S.period.m;
  const pref=String(y)+(pm!==""?"-"+String(+pm+1).padStart(2,"0"):"");
  const per=(pm!==""?MOIS[+pm].toLowerCase()+" ":"")+y;
  const years=[...new Set([cy,...vendus.filter(v=>v.dateVente).map(v=>+v.dateVente.slice(0,4))])].sort((a,b)=>b-a);
  const vendusAn=vendus.filter(v=>v.dateVente&&v.dateVente.startsWith(pref));
  const capital=stock.reduce((s,v)=>s+calc(v).cout,0);
  const netAn=vendusAn.reduce((s,v)=>s+(calc(v).net||0),0);
  const ca=vendusAn.reduce((s,v)=>s+num(v.prixVente),0);
  const benef=vendusAn.reduce((s,v)=>s+num(v.prixVente)-num(v.prixAchat)-fraisTotal(v),0);
  const tvaAn=vendusAn.reduce((s,v)=>s+(calc(v).tva||0),0);
  const moyB=vendusAn.length?benef/vendusAn.length:null;
  const moy=vendusAn.length?netAn/vendusAn.length:null;
  const js=vendus.map(joursStock).filter(x=>x!=null);
  const jm=js.length?Math.round(js.reduce((a,b)=>a+b,0)/js.length):null;
  const potentiel=stock.reduce((s,v)=>{const c=calc(v);return s+(c.net||0)},0);
  const q=Math.floor(new Date().getMonth()/3),qStart=new Date(cy,q*3,1).toISOString().slice(0,10);
  const tvaQ=vendus.filter(v=>v.dateVente&&v.dateVente>=qStart).reduce((s,v)=>s+(calc(v).tva||0),0);
  const gar=vendus.filter(v=>{const f=finGarantie(v);return f&&f>=today()});
  const prov=gar.length*S.settings.provGarantie;

  let h='<div class="top"><div><h1>Tableau de bord</h1><p>'+new Date().toLocaleDateString("fr-BE",{weekday:"long",day:"numeric",month:"long",year:"numeric"})+'</p></div><button class="btn primary" data-act="add">+ Ajouter une voiture</button></div>';
  h+='<div class="toolbar"><div class="chips" role="group" aria-label="Période"><label class="f" style="flex-direction:row;align-items:center;gap:8px">Période'+
    '<select id="p-m" data-period="m" style="width:auto">'+'<option value="">Toute l\'année</option>'+MOIS.map((n,i)=>'<option value="'+i+'"'+(String(pm)===String(i)?" selected":"")+'>'+n+'</option>').join("")+'</select>'+
    '<select id="p-y" data-period="y" style="width:auto">'+years.map(a=>'<option'+(a===y?" selected":"")+'>'+a+'</option>').join("")+'</select></label></div>'+
    ((y!==cy||pm!=="")?'<button class="btn small" data-act="periodReset">Revenir à '+cy+'</button>':"")+'</div>';
  h+='<div class="grid kpis">'+
    kpi("Chiffre d'affaires",eur(ca),vendusAn.length+" voiture"+(vendusAn.length>1?"s":"")+" vendue"+(vendusAn.length>1?"s":"")+" · "+per)+
    kpi("Bénéfice net",'<span class="'+(benef<0?"neg":"pos")+'">'+eur(benef)+'</span>',per+" · TVA marge à reverser : "+eur(tvaAn))+
    kpi("Véhicules en stock",String(stock.length),"Capital immobilisé : "+eur(capital))+
    kpi("Bénéfice moyen / voiture",moyB==null?"—":'<span class="'+(moyB<0?"neg":"pos")+'">'+eur(moyB)+'</span>',"sur les ventes · "+per)+'</div>';
  h+='<div class="grid two"><div class="card chart"><h2>Bénéfice net par mois · '+y+'</h2>'+chartMois(vendus,y,pm)+'<p class="note">Touche un mois pour le sélectionner. Prix de vente moins achat et frais, par mois de vente. Avant TVA sur la marge, impôt et cotisations.</p></div>';
  h+='<div class="card"><h2>À surveiller</h2><div class="alerts">'+alertes(L).join("")+'</div></div></div>';
  h+='<div class="grid two"><div class="card"><h2>Pipeline</h2><div class="pipeline">'+STATUTS.map(s=>'<a class="pipe" href="#garage" data-filter="'+s.k+'"><b class="num">'+L.filter(v=>v.statut===s.k).length+'</b><span>'+s.l+'</span></a>').join("")+'</div>'+
    '<p class="note" style="margin-top:12px">Marge nette potentielle du stock actuel : <b class="num">'+eur(potentiel)+'</b> (sur prix affiché ou estimation).</p></div>';
  h+='<div class="card"><h2>À mettre de côté</h2><div class="calc">'+
    row("TVA sur la marge, trimestre en cours",eur(tvaQ))+
    row("Provision garantie ("+gar.length+" voiture"+(gar.length>1?"s":"")+" sous garantie)",eur(prov))+
    '<div class="row total"><span>Total à réserver</span><span class="num">'+eur(tvaQ+prov)+'</span></div></div>'+
    '<p class="note">Plus une part pour l\'impôt et les cotisations, à voir avec ton comptable.</p></div></div>';
  return h;
}
function kpi(l,v,s){return'<div class="card kpi"><div class="lbl">'+l+'</div><div class="val num">'+v+'</div><div class="sub">'+s+'</div></div>'}
function row(a,b,cls){return'<div class="row"><span>'+a+'</span><span class="num '+(cls||"")+'">'+b+'</span></div>'}
function alertes(L){
  const out=[];const seuil=S.settings.seuilJours;
  L.forEach(v=>{
    const n=esc(v.marque+" "+v.modele),j=joursStock(v),link='href="#v-'+v.id+'"';
    if(EN_STOCK.includes(v.statut)&&j!=null&&j>seuil)out.push('<a class="alert bad" '+link+'><div><b>'+n+'</b> en stock depuis '+j+' jours<small>Revois le prix ou la présentation de l\'annonce.</small></div></a>');
    if(v.statut==="en_vente"&&!(v.check&&v.check.ct))out.push('<a class="alert" '+link+'><div><b>'+n+'</b> en vente sans CT coché<small>L\'acheteur en aura besoin pour immatriculer.</small></div></a>');
    if(v.statut==="en_vente"&&!v.prixAffiche)out.push('<a class="alert" '+link+'><div><b>'+n+'</b> sans prix affiché</div></a>');
    if(v.statut==="vendu"&&!(v.check&&v.check.facture))out.push('<a class="alert bad" '+link+'><div><b>'+n+'</b> vendue sans facture cochée<small>Facture au régime de la marge obligatoire.</small></div></a>');
    if(v.statut==="vendu"&&v.check&&v.check.facture&&!v.check.compta)out.push('<a class="alert" '+link+'><div><b>'+n+'</b> : facture à transmettre au comptable</div></a>');
    const f=finGarantie(v);if(f&&f>=today()&&daysBetween(today(),f)<=30)out.push('<a class="alert ok" '+link+'><div><b>'+n+'</b> : garantie terminée le '+fdate(f)+'</div></a>');
    const c=calc(v);if(EN_STOCK.includes(v.statut)&&c.net!=null&&c.net<0)out.push('<a class="alert bad" '+link+'><div><b>'+n+'</b> : marge nette prévue négative ('+eur(c.net)+')</div></a>');
  });
  const m=new Date().getMonth(),d=new Date().getDate();
  if([0,3,6,9].includes(m)&&d<=20)out.push('<div class="alert"><div><b>Déclaration TVA trimestrielle</b><small>Mois de déclaration : vérifie l\'échéance avec ton comptable.</small></div></div>');
  return out.length?out:['<div class="alert ok"><div>Rien à signaler.</div></div>'];
}
function chartMois(vendus,yr,sel){
  const months=[];
  for(let i=0;i<12;i++){months.push({k:yr+"-"+String(i+1).padStart(2,"0"),l:MOIS[i].slice(0,3).toLowerCase(),v:0})}
  vendus.forEach(v=>{if(!v.dateVente)return;const m=months.find(x=>x.k===v.dateVente.slice(0,7));if(m)m.v+=num(v.prixVente)-num(v.prixAchat)-fraisTotal(v)});
  const W=560,H=210,pl=46,pr=8,pt=12,pb=26,cw=(W-pl-pr)/12;
  let max=Math.max(0,...months.map(m=>m.v)),min=Math.min(0,...months.map(m=>m.v));
  if(max===0&&min===0)max=1000;
  const step=niceStep((max-min)/4);max=Math.ceil(max/step)*step;min=Math.floor(min/step)*step;
  const y=v=>pt+(max-v)/(max-min)*(H-pt-pb);
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Bénéfice net par mois sur 12 mois">';
  for(let t=min;t<=max+1e-6;t+=step){s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(t)+'" y2="'+y(t)+'" stroke="var(--line)" stroke-width="'+(t===0?1.4:.7)+'"/><text x="'+(pl-6)+'" y="'+(y(t)+4)+'" text-anchor="end">'+shortE(t)+'</text>'}
  months.forEach((m,i)=>{const x=pl+i*cw+cw*.18,w=cw*.64,y0=y(0),y1=y(m.v);
    const on=String(sel)===String(i),dim=sel!==""&&!on;
    if(on)s+='<rect x="'+(pl+i*cw+2)+'" y="'+pt+'" width="'+(cw-4)+'" height="'+(H-pt-pb)+'" rx="4" fill="var(--accent-soft)"/>';
    if(m.v!==0)s+='<rect x="'+x+'" y="'+Math.min(y0,y1)+'" width="'+w+'" height="'+Math.max(1.5,Math.abs(y1-y0))+'" rx="2.5" fill="'+(m.v<0?"var(--bad)":"var(--accent)")+'" opacity="'+(dim?.35:1)+'"><title>'+MOIS[i]+" : "+eur(m.v)+'</title></rect>';
    if(on&&m.v!==0)s+='<text x="'+(pl+i*cw+cw/2)+'" y="'+(Math.min(y0,y1)-5)+'" text-anchor="middle" style="fill:var(--ink);font-weight:600">'+shortE(m.v)+'</text>';
    s+='<text x="'+(pl+i*cw+cw/2)+'" y="'+(H-8)+'" text-anchor="middle"'+(on?' style="fill:var(--accent);font-weight:600"':"")+'>'+m.l+'</text>';
    s+='<rect x="'+(pl+i*cw)+'" y="0" width="'+cw+'" height="'+H+'" fill="transparent" style="cursor:pointer" data-month="'+i+'"><title>'+MOIS[i]+'</title></rect>'});
  return s+'</svg>';
}
function niceStep(r){const p=Math.pow(10,Math.floor(Math.log10(r||1)));const n=r/p;return(n<=1?1:n<=2?2:n<=5?5:10)*p}
function shortE(n){return Math.abs(n)>=1000?(n/1000).toLocaleString("fr-BE",{maximumFractionDigits:1})+" k€":Math.round(n)+" €"}

/* ---------- garage ---------- */
function vGarage(){
  const L=list(),f=S.garageFilter,q=S.search.toLowerCase();
  let items=L.filter(v=>f==="tous"||(f==="stock"?EN_STOCK.includes(v.statut):v.statut===f));
  if(q)items=items.filter(v=>(v.marque+" "+v.modele+" "+(v.annee||"")).toLowerCase().includes(q));
  const order={en_vente:0,preparation:1,achete:2,reperage:3,vendu:4};
  items.sort((a,b)=>(order[a.statut]-order[b.statut])||((b.dateAchat||"").localeCompare(a.dateAchat||"")));
  const chips=[["stock","En stock"],["reperage","Repérage"],["achete","Achetés"],["preparation","En préparation"],["en_vente","En vente"],["vendu","Vendus"],["tous","Tous"]];
  let h='<div class="top"><div><h1>Garage</h1><p>'+L.filter(v=>EN_STOCK.includes(v.statut)).length+' voiture(s) à ta disposition · '+L.filter(v=>v.statut==="reperage").length+' en repérage</p></div><button class="btn primary" data-act="add">+ Ajouter une voiture</button></div>';
  h+='<div class="toolbar"><div class="chips">'+chips.map(([k,l])=>'<button class="chip'+(f===k?" on":"")+'" data-filter="'+k+'">'+l+'</button>').join("")+'</div><input class="search" id="search" type="search" placeholder="Rechercher une marque, un modèle…" value="'+esc(S.search)+'"></div>';
  if(!items.length)return h+'<div class="card empty">Aucune voiture dans cette catégorie.</div>';
  h+='<div class="cars">'+items.map(carCard).join("")+'</div>';

function catMatch(marque,modele){
  const norm=x=>String(x||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g,"");
  const bk=Object.keys(CATALOGUE).find(b=>norm(b)===norm(marque)||(norm(marque).length>2&&norm(b).startsWith(norm(marque))));
  if(!bk)return null;
  const mm=norm(modele);let best=null;
  for(const k of Object.keys(CATALOGUE[bk].m)){for(const part of k.split("/")){const p=norm(part);if(p&&mm.startsWith(p)&&(!best||p.length>best.l))best={k,l:p.length}}}
  return best?{brand:bk,model:best.k}:{brand:bk,model:null};
}
function estimer(o){
  // o : {brand, model, prixNeuf?, annee, km, carburant, boite, etat, options[], entretien, proprios}
  const b=CATALOGUE[o.brand],mdl=b&&b.m[o.model];
  const neuf=num(o.prixNeuf)||(mdl?mdl[0]:0);if(!neuf)return null;
  const cls=b?b.r:2,seg=mdl?mdl[1]:2;
  const yNow=new Date().getFullYear(),age=Math.max(0,yNow-num(o.annee||yNow));
  const d={1:0.075,2:0.092,3:0.108}[cls];
  let v=neuf*(age<1?0.88:0.82*Math.pow(1-d,age-1));
  v*=1.18; // hausse des prix de l'occasion depuis 2021
  const attendu=Math.max(1,age)*15000,km=num(o.km);
  v*=Math.min(1.15,Math.max(0.65,1-(km-attendu)/10000*0.025));
  const yr=num(o.annee);
  v*={"Essence":1,"Diesel":yr>=2018?0.97:0.88,"Hybride":1.08,"Électrique":0.9,"GPL":0.86}[o.carburant]||1;
  if(o.boite==="Automatique")v*=seg>=3&&neuf<20000?1.03:1.06;
  v*=(ETATS.find(e=>e[0]===o.etat)||ETATS[1])[3];
  if(o.entretien===false)v*=0.92;
  if(num(o.proprios)>=3)v*=0.95;
  v*=1+Math.min(4,(o.options||[]).length)*0.01;
  v=Math.max(900,v);
  const spread=0.08+Math.min(0.08,age*0.005);
  const r=x=>Math.round(x/50)*50;
  const demande=Math.max(1,Math.min(3,seg-(age>14?1:0)-(km>220000?1:0)));
  return{bas:r(v*(1-spread)),median:r(v),haut:r(v*(1+spread)),demande,delai:{3:"15-30",2:"30-45",1:"45-75"}[demande],neuf,age,catalogue:!!mdl};
}

function simResult(){
  const s=S.sim,r=s.result;
  if(!r)return'<h2>Résultat</h2><p class="note">Remplis les étapes puis touche <b>Simuler</b>. Tu obtiendras le prix de revente minimum, médian et maximum, et le prix maximum à payer.</p>';
  const fr=fraisSim(s),t=S.settings.tva,mg=num(s.marge);
  const maxMed=prixAchatMax(r.median,fr,mg,t),maxBas=prixAchatMax(r.bas,fr,mg,t);
  const offre=Math.round(Math.min(maxBas,maxMed*0.9)/50)*50;
  const pos=x=>Math.max(0,Math.min(100,(x-r.bas*0.85)/(r.haut*1.15-r.bas*0.85)*100));
  const nom=s.brand==="Autre"?(s.libre||"Véhicule"):s.brand+" "+s.model;
  const nbPb=Object.keys(s.frais).filter(k=>PB_INDEX[k]&&PB_INDEX[k].g!=="Préparation à la vente").length;
  let h='<h2>'+esc(nom)+' · '+s.annee+'</h2><p class="note num">'+new Intl.NumberFormat("fr-BE").format(s.km)+' km · '+esc(s.carburant)+' · '+esc(s.boite)+' · état '+esc((ETATS.find(e=>e[0]===s.etat)||[])[1]||"").toLowerCase()+(s.options.length?' · '+s.options.length+' équipement'+(s.options.length>1?"s":""):"")+'</p>';
  h+='<div class="note" style="margin-top:12px;font-weight:600;color:var(--ink)">Prix de revente estimé'+(nbPb?" (après réparations)":"")+'</div><div class="est num" style="margin-top:6px"><div><small>Minimum</small><b>'+eur(r.bas)+'</b></div><div class="mid"><small>Médian</small><b>'+eur(r.median)+'</b></div><div><small>Maximum</small><b>'+eur(r.haut)+'</b></div></div>';
  h+='<div class="range"><i style="left:'+pos(r.bas)+'%;right:'+(100-pos(r.haut))+'%"></i><span style="left:'+pos(r.median)+'%"></span></div>';
  h+='<div class="calc" style="margin-top:6px">'+row("Demande sur le marché",["","Plus lente","Correcte","Forte"][r.demande])+row("Délai de vente probable",r.delai+" jours")+'</div>';
  h+='<div class="buybox"><small>Prix d\'achat maximum</small><div class="big num">'+eur(maxMed)+'</div><div class="note">pour revendre au prix médian avec '+eur(mg)+' de marge nette</div>'+
     '<div class="calc" style="margin-top:10px">'+row("Scénario prudent (revente au minimum)",eur(maxBas))+row("Première offre conseillée",eur(offre))+row("Frais prévus"+(nbPb?" ("+nbPb+" problème"+(nbPb>1?"s":"")+")":""),eur(fr))+'</div></div>';
  const a=num(s.achat);
  if(a){const v={prixAchat:a,prixAffiche:r.median,frais:[{montant:fr}],statut:"en_vente"},c=calc(v);
    const ok=a<=maxMed;
    h+='<div class="verdict '+(a<=maxBas?"good":ok?"mid":"bad")+'"><b>'+(a<=maxBas?"Bonne affaire":ok?"Jouable":"Trop cher")+'</b><span>'+
      (a<=maxBas?"Même en revendant au minimum, tu gardes ta marge.":ok?"Tu gardes ta marge si tu revends au prix médian. Négocie vers "+eur(offre)+".":"Il faudrait l'obtenir "+eur(a-maxMed)+" moins cher pour garder ta marge.")+
      '</span><div class="calc" style="margin-top:8px">'+row("Prix demandé",eur(a))+row("Marge nette au prix médian",eur(c.net),c.net<0?"neg":"pos")+'</div></div>';}
  h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><a class="btn small" href="'+asUrl({marque:s.brand==="Autre"?(s.libre||""):s.brand,modele:s.brand==="Autre"?"":s.model,annee:s.annee})+'" target="_blank" rel="noopener">Comparer sur AutoScout24</a><a class="btn small" href="'+dmUrl({marque:s.brand==="Autre"?(s.libre||""):s.brand,modele:s.brand==="Autre"?"":s.model})+'" target="_blank" rel="noopener">2ememain</a></div>';
  h+='<button class="btn primary" style="margin-top:12px;width:100%;justify-content:center" data-act="simsave">Ajouter au garage en repérage</button>';
  h+='<p class="note" style="margin-top:10px">Estimation calculée par l\'app (prix neuf de référence, âge, kilométrage, état). Elle ne lit pas les annonces : vérifie toujours avec 3 ou 4 annonces comparables avant d\'acheter.</p>';
  return h;
}

    gar.map(v=>{const f=finGarantie(v);return'<tr><td><a href="#v-'+v.id+'">'+esc(v.marque+" "+v.modele)+'</a></td><td>'+esc(v.acheteur||"—")+'</td><td>'+fdate(v.dateVente)+'</td><td>'+fdate(f)+'</td><td class="num">'+daysBetween(today(),f)+'</td></tr>'}).join("")+'</tbody></table></div>':'<p class="note">Aucune garantie en cours.</p>')+'</div>';

async function estimate(v){
  const prompt="Tu es un expert du marché belge des voitures d'occasion. Nous sommes le "+new Date().toLocaleDateString("fr-BE")+". Estime le prix de vente réaliste en Belgique de cette voiture, vendue par un petit négociant professionnel avec garantie 12 mois et contrôle technique fait.\n"+
    "Véhicule : "+[v.marque,v.modele].join(" ")+", année "+(v.annee||"inconnue")+", "+(v.km?v.km+" km":"kilométrage inconnu")+", "+(v.carburant||"")+", boîte "+(v.boite||"")+".\n"+
    "Réponds UNIQUEMENT avec un objet JSON, sans texte autour : {\"bas\":entier,\"median\":entier,\"haut\":entier,\"delai\":\"fourchette de jours pour vendre, ex 15-30\",\"commentaire\":\"une phrase en français sur la demande et les points à vérifier pour ce modèle\"}. Prix en euros TTC.";
  let out=null;
  try{out=sample.json?await sample.json(prompt,{modelTier:"default"}):null}catch(e){if(e&&e.code==="not_granted"){sample=null;throw e}}
  if(!out){const r=await sample(prompt,{modelTier:"default"});const m=(r.text||"").match(/\{[\s\S]*\}/);out=m?JSON.parse(m[0]):null}
  if(!out||!num(out.median))throw new Error("format");
  return{bas:Math.round(num(out.bas)),median:Math.round(num(out.median)),haut:Math.round(num(out.haut)),delai:String(out.delai||"").slice(0,20),commentaire:String(out.commentaire||"").slice(0,240),date:today()};
}

  const t=e.target,r=route();
  if(t.id==="search"){S.search=t.value;const pos=t.selectionStart;render();const s=$("#search");if(s){s.focus();try{s.setSelectionRange(pos,pos)}catch(_){}}return}
  if(t.dataset.simfra&&S.sim){const k=t.dataset.simfra;if(S.sim.frais[k]!=null){S.sim.frais[k]=num(t.value);simRefresh()}return}
  if(t.dataset.simrange&&S.sim){const k=t.dataset.simrange;S.sim[k]=+t.value;if(k==="km")$("#kmval").textContent=new Intl.NumberFormat("fr-BE").format(+t.value)+" km";if(k==="marge")$("#margeval").textContent=eur(+t.value);if(S.sim.result&&simReady(S.sim))S.sim.result=estimer(simInput(S.sim));updateSim();return}
  if(t.dataset.simtxt&&S.sim){S.sim[t.dataset.simtxt]=t.value;simRefresh();if(t.dataset.simtxt==="prixNeuf"){const b=$('[data-act="simuler"]');if(b){b.disabled=!simReady(S.sim);b.textContent=simReady(S.sim)?"Simuler":"Choisis la marque et le modèle"}}return}
  if(t.dataset.set){S.settings[t.dataset.set]=num(t.value);persistSettings();return}
  if(r.view!=="fiche")return;const v=curVeh(r.id);if(!v||v.demo)return;
  if(t.dataset.field){const k=t.dataset.field,numeric=["annee","km","prixAchat","prixAffiche","prixVente"].includes(k);v[k]=numeric?(numOrNull(t.value)??""):t.value;
    if(k==="dateVente"&&t.value&&v.statut!=="vendu"){v.statut="vendu";render()}
    if(k==="dateAchat"&&t.value&&v.statut==="reperage"){v.statut="achete";render()}
    persistVehicle(v);updateCalc();return}
  if(t.dataset.frais){const f=v.frais.find(x=>x.id===t.dataset.frais);if(f){f[t.dataset.k]=t.dataset.k==="montant"?(numOrNull(t.value)??""):t.value;persistVehicle(v);updateCalc()}return}
  if(t.dataset.estim){v.estim=v.estim||{};v.estim[t.dataset.estim]=numOrNull(t.value)??"";persistVehicle(v);updateCalc();return}
  if(t.dataset.check){v.check=v.check||{};if(t.checked)v.check[t.dataset.check]=1;else delete v.check[t.dataset.check];persistVehicle(v,true);return}
});
document.addEventListener("change",e=>{
  const t=e.target,r=route();
  if(t.dataset.simsel&&S.sim){const s=S.sim,k=t.dataset.simsel;let v=t.value;if(["annee","km","proprios","marge"].includes(k))v=+v;if(k==="entretien")v=v==="1";s[k]=v;if(k==="brand"){s.model="";s.result=null}if(s.result&&simReady(s))s.result=estimer(simInput(s));const y0=window.scrollY;render();window.scrollTo(0,y0);return}
  if(t.dataset.simck&&S.sim){const s=S.sim,o=t.dataset.simck;s.options=t.checked?[...new Set([...s.options,o])]:s.options.filter(x=>x!==o);simRefresh();return}
  if(t.dataset.simfr&&S.sim){const s=S.sim,k=t.dataset.simfr,amt=document.querySelector('[data-simfra="'+k+'"]');if(t.checked){s.frais[k]=num(amt&&amt.value)||PB_INDEX[k].c;if(amt)amt.disabled=false}else{delete s.frais[k];if(amt){amt.disabled=true;amt.value=PB_INDEX[k].c}}simRefresh();return}
  if(t.dataset.period){S.period[t.dataset.period]=t.dataset.period==="y"?+t.value:t.value;render();return}
  if(t.id==="phinput"){const v=curVeh(r.id);if(v&&!v.demo)addPhotos(v,[...t.files]);t.value="";return}
  if(t.dataset.sim&&t.tagName==="SELECT"){S.sim[t.dataset.sim]=t.value;return}
  if(r.view==="fiche"&&t.dataset.field==="statut"){const v=curVeh(r.id);if(v&&!v.demo){if(t.value==="vendu"&&!v.dateVente)v.dateVente=today();if(EN_STOCK.includes(t.value)&&!v.dateAchat)v.dateAchat=today();persistVehicle(v,true);render()}}
  if(r.view==="fiche"&&(t.dataset.field||t.dataset.frais)){const v=curVeh(r.id);if(v&&!v.demo)persistVehicle(v,true)}
});
document.addEventListener("focusout",()=>{setTimeout(()=>{if(!editing()&&route().view!=="fiche"&&route().view!=="simulateur"&&route().view!=="reglages")render()},50)});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#overlay").innerHTML=""});

document.addEventListener("toggle",e=>{const d=e.target;if(d.dataset&&d.dataset.dd&&S.sim){S.sim.open=S.sim.open||{};S.sim.open[d.dataset.dd]=d.open}},true);
let installEvt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;if(route().view==="reglages"&&!editing())render()});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{}));
boot();
})();
</script>
</body>
</html>
