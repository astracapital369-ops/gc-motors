<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>GC Motors</title>
<meta name="theme-color" content="#0f1d3d">
<meta name="apple-mobile-web-app-title" content="GC Motors">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="icon" type="image/png" href="favicon-64.png">

<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* GC Motors : marine profond + bleu signal + chrome. Barre latérale sur PC, barre de marque + onglets en bas sur téléphone. */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --surface-2:#eceef2; --line:#d9dce3;
  --ink:#141a28; --muted:#5a6377; --accent:#2a5ff0; --brand:#0f1d3d; --brand-ink:#eef2fa; --accent-ink:#ffffff; --accent-soft:#e4ebfd;
  --good:#1d7a46; --good-soft:#e1f2e8; --warn:#9a5b00; --warn-soft:#fbefd9; --bad:#b42318; --bad-soft:#fbe4e2;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1115; --surface:#171a20; --surface-2:#1f232b; --line:#2c313b;
  --ink:#eceef2; --muted:#9aa1ad; --accent:#6f97ff; --accent-ink:#0b1020; --brand:#0b1430; --brand-ink:#eef2fa; --accent-soft:#1c2744;
  --good:#4cc283; --good-soft:#15291e; --warn:#e8a83a; --warn-soft:#2c2212; --bad:#ff7b6e; --bad-soft:#331a18; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1115; --surface:#171a20; --surface-2:#1f232b; --line:#2c313b;
  --ink:#eceef2; --muted:#9aa1ad; --accent:#6f97ff; --accent-ink:#0b1020; --brand:#0b1430; --brand-ink:#eef2fa; --accent-soft:#1c2744;
  --good:#4cc283; --good-soft:#15291e; --warn:#e8a83a; --warn-soft:#2c2212; --bad:#ff7b6e; --bad-soft:#331a18; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased;touch-action:manipulation;-webkit-text-size-adjust:100%}
input,select,textarea{font-size:16px!important}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:30px;line-height:1.1} h2{font-size:21px} h3{font-size:17px}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
nav.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 16px}
.brand svg{width:42px;height:42px;flex:none;border-radius:10px}
.brand .wm{font-family:var(--display);font-weight:700;font-size:23px;line-height:1;letter-spacing:.02em;white-space:nowrap}
.brand .wm em{font-style:normal;color:var(--accent)}
.brand .wm span{display:block;font:600 9.5px var(--body);letter-spacing:.22em;color:var(--muted);margin-top:3px}
.mbar{display:none}

.dd{border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.dd summary{list-style:none;cursor:pointer;padding:11px 40px 11px 12px;position:relative;font-weight:500}
.dd summary::-webkit-details-marker{display:none}
.dd summary::after{content:"";position:absolute;right:14px;top:50%;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);transition:transform .15s}
.dd[open] summary::after{transform:translateY(-30%) rotate(-135deg)}
.ddlist{border-top:1px solid var(--line);max-height:380px;overflow-y:auto;padding:6px 0}
.ddg{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:10px 12px 4px}
.ck{display:flex;align-items:center;gap:10px;padding:7px 12px;font-size:14.5px;cursor:pointer}
.ck input[type=checkbox]{width:19px;height:19px;accent-color:var(--accent);flex:none}
.ck.fr label{display:flex;align-items:center;gap:10px;flex:1;cursor:pointer;min-width:0}
.ck .amt{width:80px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);text-align:right;font-size:14px}
.ck .amt:disabled{opacity:.45}
.ck .eu{color:var(--muted);font-size:13px}
.yr{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
.yrrow{display:flex;align-items:center;gap:10px;color:var(--ink);font-size:15px}
.yrrow input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);text-align:center}
.ddsearch{padding:6px 10px 2px}
.ddsearch input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.dual{position:relative;height:34px;margin-top:4px}
.dual .dtrack{position:absolute;left:0;right:0;top:15px;height:5px;border-radius:3px;background:var(--line)}
.dual .dfill{position:absolute;top:15px;height:5px;border-radius:3px;background:var(--accent)}
.dual input[type=range]{position:absolute;left:0;right:0;top:0;width:100%;height:34px;margin:0;background:none!important;pointer-events:none;-webkit-appearance:none;appearance:none}
.dual input[type=range]::-webkit-slider-runnable-track{background:transparent;height:34px}
.dual input[type=range]::-moz-range-track{background:transparent}
.dual input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:26px;height:26px;border-radius:50%;background:var(--surface);border:3px solid var(--accent);margin-top:4px;box-shadow:0 1px 4px rgba(0,0,0,.25);cursor:pointer}
.dual input[type=range]::-moz-range-thumb{pointer-events:auto;width:22px;height:22px;border-radius:50%;background:var(--surface);border:3px solid var(--accent);cursor:pointer}
.fraisadd{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-top:12px}
.fraisadd .f{flex:1;min-width:200px}
.msearch{position:relative}
.msearch input{width:100%;padding:10px 12px;border:1.5px solid var(--accent);border-radius:10px;background:var(--surface);color:var(--ink)}
.mres{display:flex;flex-direction:column;margin-top:4px;border-radius:10px;overflow:hidden}
.mres:not(:empty){border:1px solid var(--line);background:var(--surface);box-shadow:0 6px 16px rgba(0,0,0,.08)}
.mres button{text-align:left;padding:10px 12px;border:none;border-bottom:1px solid var(--line);background:none;cursor:pointer;font-size:15px;color:var(--ink)}
.mres button:last-child{border-bottom:none}
.mres button:hover,.mres button:focus{background:var(--accent-soft)}
.mres .mnone{padding:10px 12px;color:var(--muted);font-size:14px}
.bplab{font-size:13px;color:var(--muted);font-weight:500}
.f .bp{margin-top:4px}
.bp summary{padding:9px 40px 9px 10px;font-size:16px;font-weight:400}
.bp .ddlist{max-height:320px}
.bpi{display:block;width:100%;text-align:left;padding:10px 14px;border:none;background:none;font-size:15px;color:var(--ink);cursor:pointer}
.bpi:hover,.bpi:focus{background:var(--accent-soft)}
.bpi.on{color:var(--accent);font-weight:600}
.kmrow{display:flex;align-items:center;gap:12px}
.kmrow input[type=range]{flex:1;margin:0}
.kmrow input[type=number]{width:110px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);text-align:right}
.ficheone{max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.jform{background:var(--surface-2);border-radius:10px;padding:12px}
.jform input,.jform select{background:var(--surface)!important}
.ckline{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:14px;padding-top:8px}
.ckline input{width:18px!important;height:18px;padding:0!important;flex:none;accent-color:var(--accent)}
.ckline{cursor:pointer;padding-top:0!important}
.timeline{margin-top:14px;display:flex;flex-direction:column}
.tl{display:flex;gap:12px;position:relative;padding:0 0 12px}
.tl:not(:last-child)::before{content:"";position:absolute;left:5px;top:22px;bottom:-14px;width:2px;background:var(--line)}
.tldot{width:12px;height:12px;border-radius:50%;background:var(--accent);margin-top:14px;flex:none}.tl.st .tldot{margin-top:6px;background:var(--muted)}
.tlbody{flex:1;min-width:0;font-size:14.5px;background:var(--surface-2);border-radius:10px;padding:10px 12px}
.tl.achat .tldot{background:var(--good)}.tl.achat .tlbody{box-shadow:inset 3px 0 0 var(--good)}
.tl.fut .tlbody{box-shadow:inset 3px 0 0 var(--accent)}.tl.done .tlbody{opacity:.7}.tl.st .tlbody{background:none;padding:2px 0}
.tlmeta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px;font-size:13px;color:var(--muted)}.tlmeta .avenir{margin-left:0}
.fmodal{text-align:center;max-width:360px;margin:0 auto;padding:24px 20px 18px}
.fmico{width:56px;height:56px;border-radius:50%;background:var(--good-soft);color:var(--good);display:flex;align-items:center;justify-content:center;margin:0 auto 10px}.fmico svg{width:30px;height:30px}
.fmodal h2{margin:0 0 14px;text-align:center}
.fminfo{background:var(--surface-2);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}.fminfo b{font-size:15.5px}.fminfo small{color:var(--muted);font-size:13px}
.fmq{color:var(--muted);margin:16px 0 12px;font-size:14.5px}
.fmbig{position:relative;width:100%;box-sizing:border-box;justify-content:center;padding:13px;font-size:15.5px}
.fmrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.fmrow .btn{justify-content:center;width:100%;padding:11px 8px}
.jfs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.jfs:empty{display:none}
.jf{display:inline-flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 4px 3px 3px}
.jfo{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:inherit;font:inherit;font-size:12.5px;cursor:pointer;padding:0}
.jfo img,.fico.s{width:26px;height:26px;border-radius:5px;object-fit:cover;font-size:9px}.jf .x{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:0 3px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);pointer-events:none}
.jfadd{position:relative;display:inline-flex;align-items:center;background:none;border:1px dashed var(--line);color:var(--muted);border-radius:8px;padding:5px 10px;font:inherit;font-size:12.5px;cursor:pointer}
.tlbadges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.tlbadges .avenir{margin-left:0;padding:4px 10px;font-size:12px}
.tltxt{margin-top:6px;color:var(--ink);line-height:1.35}
.tlamt{margin-left:auto;font-weight:700;white-space:nowrap}
.tlhd{display:flex;align-items:center;gap:8px}.tlhd b{min-width:0}
.tlhd .x{margin-left:4px;background:none;border:none;color:var(--muted);font-size:20px;line-height:1;padding:0 2px;cursor:pointer}.tlhd b+.x{margin-left:auto}
.car{cursor:pointer}
.stwrap{position:relative;display:inline-flex;align-items:center;height:30px;border-radius:999px;flex:none;cursor:pointer}
.stwrap .stsel{appearance:none;-webkit-appearance:none;background:transparent;border:none;color:inherit;height:30px;line-height:30px;padding:0 30px 0 13px;font-size:13px!important;font-weight:600;cursor:pointer;text-align:center;text-align-last:center;margin:0}
.stwrap .stico{position:absolute;right:10px;top:50%;width:12px;height:12px;transform:translateY(-50%);pointer-events:none}
.stwrap.st-reperage{background:var(--surface-2);color:var(--muted)}
.stwrap.st-achete{background:var(--accent-soft);color:var(--accent)}
.stwrap.st-preparation{background:var(--warn-soft);color:var(--warn)}
.stwrap.st-en_vente{background:var(--good-soft);color:var(--good)}
.stwrap.st-vendu{background:var(--surface-2);color:var(--ink)}
.stwrap:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.cacts{display:flex;gap:8px}
.cacts .btn{flex:1;justify-content:center}
.kvs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
.kv{display:flex;flex-direction:column;gap:1px;min-width:0}
.kv span{font-size:12.5px;color:var(--muted)}
.kv b{font-weight:600;overflow-wrap:anywhere}
.chip.ro{cursor:default;background:var(--surface-2);border-color:transparent}
.contact{display:flex;flex-direction:column;gap:3px;font-size:15px}
.contact a{color:var(--accent);text-decoration:none}
.card.dphotos{padding:0;overflow:hidden}
.dcover{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:16/10;background:var(--surface-2);border:none;padding:0;cursor:zoom-in}
.dcover img{width:100%;height:100%;object-fit:cover;display:block}
.ctrack{display:flex;width:100%;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain}.ctrack::-webkit-scrollbar{display:none}.cslide{flex:0 0 100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always}.cslide img{width:100%;height:100%;object-fit:cover;display:block}
.dcar{position:relative}.dtrack{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}.dtrack::-webkit-scrollbar{display:none}.dtrack .dcover{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always}
.dcount{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:3px 8px;border-radius:10px;pointer-events:none}
.dthumbs{display:flex;gap:6px;padding:8px;overflow-x:auto}.dthumbs .ph.on{outline:2px solid var(--accent);outline-offset:-2px}
.dthumbs .ph{width:72px;flex:none}
.ckro{font-size:14px;color:var(--muted);padding:3px 0}
.ckro.ok{color:var(--good)}
.dk .kpi .val{font-size:24px}
@media (max-width:760px){.kvs{grid-template-columns:1fr 1fr}}
.pdfov{position:fixed;inset:0;z-index:80;background:#0b1120;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}
.pdfbar{display:flex;justify-content:space-between;align-items:center;color:#fff;padding-bottom:10px;font-size:16px}
.pdfpages{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:12px;-webkit-overflow-scrolling:touch}
.pdfpages.zoomed{align-items:flex-start}
.pdfzoom{display:flex;gap:6px;align-items:center}.pdfzoom .btn{min-width:38px;padding:6px 10px;font-size:14px;line-height:1.2}.pdfzoom span{min-width:44px;text-align:center;font-size:13px;color:#cfd6e6}
.pdfpage{width:100%;max-width:800px;height:auto;flex:none;background:#fff;border-radius:4px;box-shadow:0 4px 18px rgba(0,0,0,.4)}
.pdfframe{width:100%;max-width:800px;height:100%;border:none;background:#fff}
.pdfacts{display:flex;gap:8px;padding-top:10px}
.pdfacts .btn{flex:1 1 0;min-width:0;justify-content:center;padding:10px 12px;font-size:15px;white-space:nowrap;line-height:1.2}.pdfzoom .btn.icon{padding:6px 9px;display:inline-flex;align-items:center}
.acpt{display:grid;grid-template-columns:1.1fr 1.2fr .9fr auto;gap:6px;margin-bottom:6px;align-items:center}
.acpt input,.acpt select{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0}
.bdocs{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
@media (max-width:760px){.bdocs{grid-template-columns:1fr}.acpt{grid-template-columns:1fr 1fr;}.acpt .x{grid-column:2;justify-self:end}}
.gfilter{flex:1;min-width:180px;max-width:320px}
.gfilter select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.toolbar{align-items:flex-end}
.sales{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:12px}
.sale{display:flex;flex-direction:column;gap:10px}
.salehd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.salecar{font-family:var(--display);font-size:19px;font-weight:600;color:var(--ink);text-decoration:none;line-height:1.15}
.saleprix{text-align:right;display:flex;flex-direction:column}
.saleprix b{font-size:17px}
.saleprix span{font-size:12.5px}
.salecli{background:var(--surface-2);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;font-size:14.5px}
.salecli a{color:var(--accent);text-decoration:none}
.clihd{display:flex;justify-content:space-between;gap:8px;align-items:center}
.clinum{font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:999px}
.bandes{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:8px;align-items:stretch}
.bande{border-radius:12px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:4px}
.bande small{font-size:12px;font-weight:600;letter-spacing:.02em}
.bande b{font-family:var(--display);font-size:22px;line-height:1.05}
.bande.b1{background:var(--surface-2);color:var(--muted)}
.bande.b1 b{color:var(--ink)}
.bande.b2{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px rgba(42,95,240,.28);padding:16px 8px}
.bande.b2 b{font-size:28px}
.bande.b3{background:var(--surface-2);color:var(--muted)}
.bande.b3 b{color:var(--ink)}
.bbar{height:6px;border-radius:3px;margin:12px 6px 0;background:linear-gradient(90deg,var(--line),var(--accent),var(--line))}
.estlinks{display:flex;gap:12px;align-items:center;justify-content:center;margin-top:12px;font-size:14px}
.estlinks a{color:var(--accent);font-weight:600;text-decoration:none}
.card.liq{padding:12px 16px;border-left:4px solid var(--accent)}
.liq summary{display:flex;align-items:center;justify-content:space-between;gap:10px;list-style:none;cursor:pointer}
.liq summary::-webkit-details-marker{display:none}
.liq .lbl{font-size:14px;color:var(--muted);font-weight:600}
.liq .lbl::after{content:" ›";color:var(--muted)}
.liq[open] .lbl::after{content:" ⌄"}
.liqval{font-family:var(--display);font-size:26px;font-weight:600;line-height:1;color:var(--accent)}
.liqval.neg{color:var(--bad)}
.liqrows{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:10px}
.liqrows b{color:var(--ink);font-weight:600;margin-left:3px}
.liqrows a{color:var(--accent);font-weight:600;text-decoration:none}
.simdone{max-width:640px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.simacts{display:flex;flex-direction:column;gap:8px}
@media (max-width:980px){.stack.hide-m,.hide-m{display:none!important}}
.sstep{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sstep.fold{width:100%;background:none;border:none;padding:0;cursor:pointer;color:inherit;font:inherit;text-align:left}
.sstep .chev{width:20px;height:20px;margin-left:auto;color:var(--muted);transition:transform .2s;transform:rotate(180deg);flex:none}
.card.folded > .sstep{margin-bottom:0}.card.folded > .sstep .chev{transform:none}
.card.folded > :not(.sstep){display:none!important}
.dcard > h2.dfold{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}.dcard > h2.dfold .chev{width:20px;height:20px;margin-left:auto;color:var(--muted);transition:transform .2s;transform:rotate(180deg);flex:none}
.dcard.folded > h2.dfold{margin-bottom:0;display:flex!important}.dcard.folded > h2.dfold .chev{transform:none}.dcard.folded > :not(h2){display:none!important}

const CAT2TYPE={"Réparation":"Réparation","Entretien":"Entretien","Pneus":"Pneus","Contrôle technique":"Contrôle technique","Car-Pass":"Car-Pass","Nettoyage":"Nettoyage / préparation","Garantie externe":"Garantie externe","Transport / plateau":"Transport / plateau","Annonce":"Annonce publiée","Autre":"Autre"};
/* les anciens frais (non liés au suivi) deviennent des entrées du suivi */
function migrateFrais(v){let ch=false;v.journal=v.journal||[];(v.frais||[]).forEach(f=>{if(f.j&&v.journal.some(e=>e.id===f.j))return;if(!num(f.montant)&&!f.libelle)return;const e={id:newId(),t:Date.now(),date:v.dateAchat||today(),type:CAT2TYPE[f.cat]||"Autre",texte:f.libelle||"",montant:num(f.montant)||""};v.journal.push(e);f.j=e.id;ch=true});if(ch)v.frais=[];return ch}
function fraisJ(v){return (v.journal||[]).filter(e=>e.type!=="Statut"&&num(e.montant))}
function fraisTotal(v){if((v.frais||[]).length)migrateFrais(v);return fraisJ(v).reduce((s,e)=>s+num(e.montant),0)}
function prixRef(v){if(v.statut==="vendu"&&v.prixVente)return num(v.prixVente);if(v.prixAffiche)return num(v.prixAffiche);if(v.estim&&v.estim.median)return num(v.estim.median);return null}
function calc(v,taux){
  taux=taux??S.settings.tva;
  const achat=num(v.prixAchat),fr=fraisTotal(v),ref=prixRef(v);
  if(ref==null)return{achat,frais:fr,ref:null,brute:null,tva:null,net:null,cout:achat+fr};
  const brute=ref-achat,tva=brute>0?brute*taux/(100+taux):0,net=brute-tva-fr;
  return{achat,frais:fr,ref,brute,tva,net,cout:achat+fr,pct:achat?net/(achat+fr)*100:null};
}
function joursStock(v){if(!v.dateAchat)return null;return daysBetween(v.dateAchat,v.statut==="vendu"&&v.dateVente?v.dateVente:today())}
function garMois(v){return v.clientType==="pro"?num(v.garPro):(num(S.settings.dureeGarantie)||12)}
function garTexte(v){const m=garMois(v);if(v.clientType==="pro")return m?"garantie conventionnelle de "+m+" mois à compter de la livraison, limitée aux organes moteur, boîte de vitesses et transmission.":"vente entre professionnels : véhicule vendu sans garantie, dans l'état connu et accepté par l'acheteur.";return"garantie légale de conformité de "+m+" mois à compter de la livraison (art. 1649quater du Code civil)."}
function finGarantie(v){if(!v.dateVente)return null;const m=garMois(v);if(!m)return null;const d=new Date(v.dateVente+"T12:00:00");d.setMonth(d.getMonth()+m);return d.toISOString().slice(0,10)}
function progress(v){let t=0,d=0;CHECK.forEach(g=>g.items.forEach(([k])=>{t++;if(v.check&&v.check[k])d++}));return Math.round(d/t*100)}
function prixAchatMax(revente,frais,marge,taux){const M=(marge+frais)*(100+taux)/100;return revente-M}

/* aperçu générique d'un PDF (résultat {blob,name,titre,doc}) */
async function savePdfDoc(v,r,cat){try{const data=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(r.blob)});
  if(data.length>950000){toast("PDF trop lourd pour être importé automatiquement.");return}
  const L=factCache[v.id]||(factCache[v.id]=await photosFor(v.id).then(()=>factCache[v.id]||[]).catch(()=>[]));
  for(const old of (factCache[v.id]||[]).filter(f=>f.cat===cat)){try{await deletePhoto(old.id)}catch(e){}}
  factCache[v.id]=(factCache[v.id]||[]).filter(f=>f.cat!==cat);
  const p={id:newId(),vehicleId:v.id,kind:"facture",cat,mime:"application/pdf",name:r.name,full:data,createdAt:Date.now()};await savePhoto(p);factCache[v.id].push(p);
  refreshFacts(v);toast((cat==="bdc"?"Bon de commande":"Facture")+" importé"+(cat==="bdc"?"":"e")+" dans les documents.")}catch(e){toast("Import dans les documents impossible.")}}

/* 4. Texte d'annonce */
function annonceTxt(v){
  const st=S.settings,f=n=>new Intl.NumberFormat("fr-BE").format(n);const ch=num(v.puissance)?Math.round(num(v.puissance)*1.35962):0;
  const L=[];L.push([v.marque,v.modele,v.moteur].filter(Boolean).join(" ")+(v.annee?" - "+v.annee:"")+(v.km?" - "+f(num(v.km))+" km":""));L.push("");
  const it=[];
  if(v.premiereImmat)it.push("1re immatriculation : "+moisAn(v.premiereImmat));else if(v.annee)it.push("Année : "+v.annee);
  if(v.km)it.push("Kilométrage : "+f(num(v.km))+" km (Car-Pass)");
  if(v.carburant)it.push("Carburant : "+v.carburant);if(v.boite)it.push("Boîte : "+v.boite.toLowerCase());
  if(ch)it.push("Puissance : "+ch+" ch ("+num(v.puissance)+" kW)");if(v.cylindree)it.push("Cylindrée : "+f(num(v.cylindree))+" cm³");
  if(v.euronorm)it.push("Norme : "+v.euronorm);if(v.couleur)it.push("Couleur : "+v.couleur);
  const et=(ETATS.find(e=>e[0]===v.etat)||[])[1];if(et)it.push("État général : "+et.toLowerCase());
  if(v.entretien!==false)it.push("Carnet d'entretien complet");if(v.proprios)it.push(v.proprios>=3?"3 propriétaires et plus":v.proprios+" propriétaire"+(v.proprios>1?"s":""));
  L.push(...it.map(x=>"- "+x));
  const opts=(v.options||[]).filter(o=>!/^(ABS|Antidémarrage|Airbags frontaux|Kit anti-crevaison)$/.test(o));
  if(opts.length){L.push("");L.push("Équipements :");opts.slice(0,30).forEach(o=>L.push("- "+o));if(opts.length>30)L.push("- et plus encore")}
  L.push("");
  if(v.check&&v.check.ct)L.push("Contrôle technique OK pour la vente.");
  L.push("Vendue par un professionnel avec "+(num(st.dureeGarantie)||12)+" mois de garantie.");
  if(v.prixAffiche)L.push("Prix : "+f(num(v.prixAffiche))+" €");
  L.push("");L.push((st.entNom||"GC Motors")+(st.entTel?" - "+st.entTel:"")+(st.entEmail?" - "+st.entEmail:""));
  return L.join("\n");
}
function annonceModal(v){const ov=$("#overlay");const txt=annonceTxt(v);
  ov.innerHTML='<div class="modal" role="dialog" aria-modal="true" aria-labelledby="antit"><div class="card"><h2 id="antit">Texte d\'annonce</h2><p class="note">Généré depuis la fiche. Relis-le et modifie-le si besoin avant de le coller sur 2ememain ou AutoScout24.</p><textarea id="antxt" rows="16" style="width:100%;margin-top:10px;font-size:14px;line-height:1.4">'+esc(txt)+'</textarea><div class="fmrow" style="margin-top:12px"><button class="btn" data-an="close">Fermer</button><button class="btn primary" data-an="copy">Copier le texte</button></div></div></div>';
  ov.onclick=async e=>{const b=e.target.closest("[data-an]");if(!b){if(e.target.classList.contains("modal"))ov.innerHTML="";return}if(b.dataset.an==="close"){ov.innerHTML="";return}
    const t=$("#antxt").value;try{await navigator.clipboard.writeText(t);toast("Texte copié : colle-le dans ton annonce.")}catch(err){const a=$("#antxt");a.focus();a.select();try{document.execCommand("copy");toast("Texte copié.")}catch(_){toast("Sélectionne le texte et copie-le.")}}}}

function chartMois(vendus,yr,sel){
  const months=[];
  for(let i=0;i<12;i++){months.push({k:yr+"-"+String(i+1).padStart(2,"0"),l:MOIS[i].slice(0,3).toLowerCase(),v:0})}
  vendus.forEach(v=>{if(!v.dateVente)return;const m=months.find(x=>x.k===v.dateVente.slice(0,7));if(m)m.v+=num(v.prixVente)-num(v.prixAchat)-fraisTotal(v)});
  months.forEach(m=>{m.v-=fgTotal(m.k)});
  const W=560,H=210,pl=46,pr=8,pt=12,pb=26,cw=(W-pl-pr)/12;
  let max=Math.max(0,...months.map(m=>m.v)),min=Math.min(0,...months.map(m=>m.v));
  if(max===0&&min===0)max=1000;
  const step=niceStep((max-min)/4);max=Math.ceil(max/step)*step;min=Math.floor(min/step)*step;
  const y=v=>pt+(max-v)/(max-min)*(H-pt-pb);
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Bénéfice net par mois sur 12 mois">';
  for(let t=min;t<=max+1e-6;t+=step){s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(t)+'" y2="'+y(t)+'" stroke="var(--line)" stroke-width="'+(t===0?1.4:.7)+'"/><text x="'+(pl-6)+'" y="'+(y(t)+4)+'" text-anchor="end">'+shortE(t)+'</text>'}
  months.forEach((m,i)=>{const x=pl+i*cw+cw*.18,w=cw*.64,y0=y(0),y1=y(m.v);
    const on=String(sel)===String(i),dim=sel!==""&&!on;
    if(on)s+='<rect x="'+(pl+i*cw+2)+'" y="'+pt+'" width="'+(cw-4)+'" height="'+(H-pt-pb)+'" rx="4" fill="var(--accent-soft)"/>';
    if(m.v!==0)s+='<rect x="'+x+'" y="'+Math.min(y0,y1)+'" width="'+w+'" height="'+Math.max(1.5,Math.abs(y1-y0))+'" rx="2.5" fill="'+(m.v<0?"var(--bad)":"var(--accent)")+'" opacity="'+(dim?.35:1)+'"><title>'+MOIS[i]+" : "+eur(m.v)+'</title></rect>';
    if(on&&m.v!==0)s+='<text x="'+(pl+i*cw+cw/2)+'" y="'+(Math.min(y0,y1)-5)+'" text-anchor="middle" style="fill:var(--ink);font-weight:600">'+shortE(m.v)+'</text>';
    s+='<text x="'+(pl+i*cw+cw/2)+'" y="'+(H-8)+'" text-anchor="middle"'+(on?' style="fill:var(--accent);font-weight:600"':"")+'>'+m.l+'</text>';
    s+='<rect x="'+(pl+i*cw)+'" y="0" width="'+cw+'" height="'+H+'" fill="transparent" style="cursor:pointer" data-month="'+i+'"><title>'+MOIS[i]+'</title></rect>'});
  return s+'</svg>';
}
function niceStep(r){const p=Math.pow(10,Math.floor(Math.log10(r||1)));const n=r/p;return(n<=1?1:n<=2?2:n<=5?5:10)*p}
function shortE(n){return Math.abs(n)>=1000?(n/1000).toLocaleString("fr-BE",{maximumFractionDigits:1})+" k€":Math.round(n)+" €"}

       return '<details class="dd"><summary><span>'+opts.length+' équipement'+(opts.length>1?'s':'')+' — voir la liste</span></summary><div class="ddlist">'+grp+(rest.length?'<div class="ddg">Autres</div><div class="chips" style="padding:4px 12px 8px">'+rest.map(x=>'<span class="chip ro">'+esc(x)+'</span>').join("")+'</div>':'')+'</div></details>'})():'<p class="note">Aucun équipement renseigné.</p>')+'</div>';
  // état
  h+='<div class="card"><h2>État et historique</h2><div class="kvs">'+kv("État général",esc(etat||""))+kv("Carnet d'entretien",v.entretien===false?"Incomplet ou absent":"Complet")+kv("Propriétaires",v.proprios?(v.proprios>=3?"3 et plus":v.proprios):"")+'</div></div>';
  // frais et suivi
  const J=suiviList(v);
  h+='<div class="card"><h2>Frais et suivi véhicule</h2>'+(J.length?'<div class="timeline">'+J.map(e=>tlItem(e,v,false)).join("")+'</div>':'<p class="note">Aucune entrée.</p>')+
     '<div class="row total" style="display:flex;justify-content:space-between;margin-top:12px;border-top:1px solid var(--line);padding-top:10px;font-weight:600"><span>Total des frais</span><span class="num">'+eur(c.frais)+'</span></div></div>';
  // achat
  h+='<div class="card"><h2>Achat</h2><div class="kvs">'+kv(v.statut==="reperage"?"Prix demandé":"Prix d'achat",v.prixAchat?eur(num(v.prixAchat)):"")+kv("Date d'achat",v.dateAchat?fdate(v.dateAchat):"")+kv("Source",esc(v.source||""))+kv("Coût total",eur(c.cout))+'</div><div class="note" style="margin:12px 0 6px;font-weight:600;color:var(--ink)">Vendeur</div>'+person("vendeur","du vendeur",v.vendeur)+'</div>';
  // vente
  const acs=(v.acomptes||[]).filter(a=>num(a.montant)),docsR=v.bdcDocs&&v.bdcDocs.length?v.bdcDocs:BDC_DOCS.slice(0,4);
  h+='<div class="card"><h2>Vente</h2><div class="subl">Prix de vente conseillé</div><div>'+bandesHtml(v)+'</div>'+
     '<h3 class="subh">Vente</h3><div class="kvs">'+kv("Prix affiché",v.prixAffiche?eur(num(v.prixAffiche)):"")+kv("Prix de vente final",v.prixVente?eur(num(v.prixVente)):"")+kv("Date de vente",v.dateVente?fdate(v.dateVente):"")+kv("Payer avant le",v.payerAvant?fdate(v.payerAvant):"")+
     kv("Marge brute",c.brute!=null?eur(c.brute):"")+kv("TVA sur la marge",c.tva!=null?eur(c.tva):"")+kv("Marge nette",c.net!=null?'<span style="color:var(--'+(c.net<0?"bad":"good")+')">'+eur(c.net)+'</span>':"")+(v.dateVente?kv("Garantie jusqu'au",fdate(finGarantie(v))):"")+'</div>'+
     '<div class="note" style="margin:12px 0 6px;font-weight:600;color:var(--ink)">Acomptes reçus</div>'+(acs.length?'<div class="calc">'+acs.map(a=>row((a.mode||"Acompte")+(a.date?" · "+fdate(a.date):""),eur(num(a.montant)))).join("")+'</div>':'<p class="note">Aucun acompte.</p>')+
     '<div class="note" style="margin:12px 0 6px;font-weight:600;color:var(--ink)">Documents remis à la livraison</div><div class="chips">'+docsR.map(d=>'<span class="chip ro">'+esc(d)+'</span>').join("")+'</div>'+
     '<div class="note" style="margin:12px 0 6px;font-weight:600;color:var(--ink)">Client'+(v.clientNum?' · n° '+esc(v.clientNum):'')+'</div>'+person("client","du client",v.acheteur)+'</div>';
  // dossier
  h+='<div class="card"><h2>Dossier · '+p+' %</h2><div class="bar" style="margin-bottom:10px"><i style="width:'+p+'%"></i></div><div class="check">'+CHECK.map(g=>'<h3>'+g.g+'</h3>'+g.items.map(([k,l])=>'<div class="ckro'+(v.check&&v.check[k]?" ok":"")+'">'+(v.check&&v.check[k]?"✓":"○")+' '+l+'</div>').join("")).join("")+'</div></div>';
  h+='<div class="card"><h2>Notes</h2>'+(v.notes?'<p style="white-space:pre-wrap;margin:0">'+esc(v.notes)+'</p>':'<p class="note">Aucune note.</p>')+'</div>';
  if(!v.demo)h+='<div class="card" id="ddocs"><h2>Documents</h2><div id="doclist">'+docsHtml(v)+'</div></div>';
  if(!v.demo&&v.statut!=="vendu")h+='<a class="btn primary big" href="#v-'+v.id+'">Modifier la fiche</a>';

}
function detPhotos(v){const list=photoCache[v.id]||[];if(v.demo||!list.length)return'<div class="dcover">'+(v.cover?'<img src="'+v.cover+'" alt="">':'<span class="note">Aucune photo. '+(v.demo?"":'<a href="#v-'+v.id+'">Ajouter des photos</a>')+'</span>')+'</div>';
  return'<div class="dcar"><div class="dtrack" id="dtrack">'+list.map((ph,i)=>'<button class="dcover" data-act="viewph" data-i="'+i+'" aria-label="Agrandir la photo '+(i+1)+'"><img src="'+ph.full+'" alt="" loading="'+(i?"lazy":"eager")+'" decoding="async"></button>').join("")+'</div>'+(list.length>1?'<span class="dcount" id="dcount">1 / '+list.length+'</span>':'')+'</div>'+(list.length>1?'<div class="dthumbs">'+list.map((ph,i)=>'<button class="ph'+(i?'':' on')+'" data-dthumb="'+i+'"><img src="'+ph.thumb+'" alt=""></button>').join("")+'</div>':"")}

function estimAuto(v){const m=catMatch(v.marque,v.modele);if(!m||!m.model||!num(v.annee))return null;const mo=moteursDe(m.brand,m.model),e=mo&&v.moteur&&mo.e.find(x=>x[0]===v.moteur);
  const r=estimer({brand:m.brand,model:m.model,annee:v.annee,km:num(v.km)||Math.max(1,new Date().getFullYear()-num(v.annee))*15000,carburant:v.carburant,coef:e?e[2]:1,boite:v.boite,etat:v.etat||"bon",options:v.options||[],entretien:v.entretien!==false,proprios:v.proprios||2});
  return r?{bas:r.bas,median:r.median,haut:r.haut,delai:r.delai}:null}
function syncEstim(v){if(v.demo)return v.estim;const r=estimAuto(v);if(r){if(!v.estim||v.estim.bas!==r.bas||v.estim.median!==r.median||v.estim.haut!==r.haut){v.estim={...r,date:today(),auto:true};persistVehicle(v)}}return v.estim}
function bandesHtml(v){const e=syncEstim(v);
  if(!e||!e.median)return'<p class="note">Choisis la marque, le modèle et l\'année : l\'estimation apparaîtra ici automatiquement.</p>';
  return'<div class="bandes num"><div class="bande b1"><small>Vente rapide</small><b>'+eur(e.bas)+'</b></div><div class="bande b2"><small>Prix conseillé</small><b>'+eur(e.median)+'</b></div><div class="bande b3"><small>Prix haut</small><b>'+eur(e.haut)+'</b></div></div>'+
    '<div class="bbar"><i></i></div>'+(e.delai?'<p class="note" style="margin-top:8px;text-align:center">Délai de vente estimé : '+esc(e.delai)+' jours</p>':'')}
function estBlock(e){if(!e||!e.median)return'<p class="note">Aucune estimation pour l\'instant.</p>';return'<div class="est num"><div><small>Bas</small><b>'+eur(e.bas)+'</b></div><div><small>Médian</small><b>'+eur(e.median)+'</b></div><div><small>Haut</small><b>'+eur(e.haut)+'</b></div></div>'+(e.delai?'<p class="note" style="margin-top:8px">Délai de vente estimé : '+esc(e.delai)+' jours.</p>':"")}
function slug(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim().split(/\s+/)[0].replace(/[^a-z0-9-]/g,"")}
function asUrl(v){const y=num(v.annee);let u="https://www.autoscout24.be/fr/lst/"+encodeURIComponent(slug(v.marque))+"/"+encodeURIComponent(slug(v.modele));if(y)u+="?fregfrom="+(y-1)+"&fregto="+(y+1);return u}
function dmUrl(v){return"https://www.2ememain.be/q/"+encodeURIComponent((v.marque+" "+v.modele).trim())+"/"}
function updateCalc(){
  const id=route().id,v=curVeh(id),box=$("#calcbox");if(!v||!box)return;
  const eb=$("#estbox");if(eb)eb.innerHTML=bandesHtml(v);
  const ab=$("#achatbox");if(ab)ab.innerHTML=row("Prix d'achat",eur(num(v.prixAchat)))+row("Total des frais",eur(fraisTotal(v)))+'<div class="row total"><span>Coût total du véhicule</span><span class="num">'+eur(num(v.prixAchat)+fraisTotal(v))+'</span></div>';
  const c=calc(v);
  let h='<div class="calc">';
  if(c.ref==null){h+='<p class="note">Indique un prix affiché ou lance une estimation pour voir la marge.</p>'+row("Coût total (achat + frais)",eur(c.cout))}
  else{
    h+='<div class="big num '+(c.net<0?"neg":"pos")+'">'+eur(c.net)+'</div><div class="note">marge nette '+(v.statut==="vendu"?"réalisée":"prévue")+(c.pct!=null?" · "+c.pct.toFixed(1).replace(".",",")+" % du coût":"")+'</div>'+
    row(v.statut==="vendu"?"Prix de vente":(v.prixAffiche?"Prix affiché":"Estimation médiane"),eur(c.ref))+row("Prix d'achat","− "+eur(c.achat))+row("Marge brute",eur(c.brute))+
    row("TVA sur la marge ("+S.settings.tva+"/"+(100+S.settings.tva)+")","− "+eur(c.tva))+row("Frais","− "+eur(c.frais))+
    '<div class="row total"><span>Reste avant impôt</span><span class="num">'+eur(c.net)+'</span></div>';
  }
  const j=joursStock(v);if(j!=null)h+=row(v.statut==="vendu"?"Durée en stock":"En stock depuis",j+" jours");
  box.innerHTML=h+'</div>';
  const mb=$("#maxbox");if(mb){const rev=num(v.prixAffiche)||(v.estim&&num(v.estim.median))||0;
    if(!rev)mb.innerHTML='<p class="note">Besoin d\'un prix de revente (affiché ou estimé).</p>';
    else{const fr=Math.max(fraisTotal(v),0),mx=prixAchatMax(rev,fr,S.settings.margeVisee,S.settings.tva);
      mb.innerHTML='<div class="calc"><div class="big num">'+eur(mx)+'</div><div class="note">pour revendre à '+eur(rev)+' avec '+eur(fr)+' de frais et '+eur(S.settings.margeVisee)+' de marge nette visée.</div>'+(num(v.prixAchat)?row(v.statut==="reperage"?"Prix demandé":"Payé",eur(v.prixAchat),num(v.prixAchat)>mx?"neg":"pos"):"")+'</div>'}}
}

const ETATS=[["excellent","Excellent","Comme neuve, aucun défaut",1.06],["bon","Bon","Petites traces d'usage",1],["moyen","Moyen","Rayures, usure visible",0.9],["rafraichir","À rafraîchir","Gros défauts ou travaux",0.78]];
function catMatch(marque,modele){
  const norm=x=>String(x||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g,"");
  const bk=Object.keys(CATALOGUE).find(b=>norm(b)===norm(marque)||(norm(marque).length>2&&norm(b).startsWith(norm(marque))));
  if(!bk)return null;
  const mm=norm(modele);let best=null;
  for(const k of Object.keys(CATALOGUE[bk].m)){for(const part of k.split("/")){const p=norm(part);if(p&&mm.startsWith(p)&&(!best||p.length>best.l))best={k,l:p.length}}}
  return best?{brand:bk,model:best.k}:{brand:bk,model:null};
}
// décote annuelle propre à certains modèles qui gardent mieux leur valeur que leur marque
const DECOTE_MODELE={"Ford|Mustang":0.075,"Ford|Ranger":0.07,"Chevrolet|Camaro":0.075,"Chevrolet|Corvette":0.07,"Dodge|Challenger":0.075,
  "Porsche|911":0.045,"Porsche|Boxster / 718 Boxster":0.06,"Porsche|Cayman / 718 Cayman":0.06,"Toyota|Land Cruiser":0.055,"Toyota|Hilux":0.06,
  "Toyota|GT86 / GR86":0.065,"Toyota|Supra":0.065,"Jeep|Wrangler":0.06,"Mercedes|Classe G":0.045,"Land Rover|Defender":0.065,"Mazda|MX-5":0.065,"Suzuki|Jimny":0.045};
function estimer(o){
  // o : {brand, model, prixNeuf?, annee, km, carburant, boite, etat, options[], entretien, proprios}
  const b=CATALOGUE[o.brand],mdl=b&&b.m[o.model];
  const neuf=num(o.prixNeuf)||(mdl?mdl[0]:0);if(!neuf)return null;
  const cls=b?b.r:2,seg=mdl?mdl[1]:2;
  const yNow=new Date().getFullYear(),age=Math.max(0,yNow-num(o.annee||yNow));
  const d=DECOTE_MODELE[o.brand+"|"+o.model]??{1:0.075,2:0.092,3:0.108}[cls];
  let v=neuf*(age<1?0.88:0.82*Math.pow(1-d,age-1));
  v*=1.18; // hausse des prix de l'occasion depuis 2021
  const attendu=Math.max(1,age)*15000,km=num(o.km);
  v*=Math.min(1.15,Math.max(0.65,1-(km-attendu)/10000*0.025));
  const yr=num(o.annee);
  v*={"Essence":1,"Diesel":yr>=2018?0.97:0.88,"Hybride":1.08,"Électrique":0.9,"GPL":0.86}[o.carburant]||1;
  v*=num(o.coef)||1;
  if(o.boite==="Automatique")v*=seg>=3&&neuf<20000?1.03:1.06;
  v*=(ETATS.find(e=>e[0]===o.etat)||ETATS[1])[3];
  if(o.entretien===false)v*=0.92;
  if(num(o.proprios)>=3)v*=0.95;
  v*=1+Math.min(10,(o.options||[]).reduce((a,l)=>a+(EQ_POIDS[l]!=null?EQ_POIDS[l]:0.5),0))/100;
  v=Math.max(900,v);
  const spread=0.08+Math.min(0.08,age*0.005);
  const r=x=>Math.round(x/50)*50;
  const demande=Math.max(1,Math.min(3,seg-(age>14?1:0)-(km>220000?1:0)));
  return{bas:r(v*(1-spread)),median:r(v),haut:r(v*(1+spread)),demande,delai:{3:"15-30",2:"30-45",1:"45-75"}[demande],neuf,age,catalogue:!!mdl};
}

async function estimate(v){
  const prompt="Tu es un expert du marché belge des voitures d'occasion. Nous sommes le "+new Date().toLocaleDateString("fr-BE")+". Estime le prix de vente réaliste en Belgique de cette voiture, vendue par un petit négociant professionnel avec garantie 12 mois et contrôle technique fait.\n"+
    "Véhicule : "+[v.marque,v.modele].join(" ")+", année "+(v.annee||"inconnue")+", "+(v.km?v.km+" km":"kilométrage inconnu")+", "+(v.carburant||"")+", boîte "+(v.boite||"")+".\n"+
    "Réponds UNIQUEMENT avec un objet JSON, sans texte autour : {\"bas\":entier,\"median\":entier,\"haut\":entier,\"delai\":\"fourchette de jours pour vendre, ex 15-30\",\"commentaire\":\"une phrase en français sur la demande et les points à vérifier pour ce modèle\"}. Prix en euros TTC.";
  let out=null;
  try{out=sample.json?await sample.json(prompt,{modelTier:"default"}):null}catch(e){if(e&&e.code==="not_granted"){sample=null;throw e}}
  if(!out){const r=await sample(prompt,{modelTier:"default"});const m=(r.text||"").match(/\{[\s\S]*\}/);out=m?JSON.parse(m[0]):null}
  if(!out||!num(out.median))throw new Error("format");
  return{bas:Math.round(num(out.bas)),median:Math.round(num(out.median)),haut:Math.round(num(out.haut)),delai:String(out.delai||"").slice(0,20),commentaire:String(out.commentaire||"").slice(0,240),date:today()};
}

  ov.onclick=e=>{const b=e.target.closest("[data-fm]");if(!b&&!e.target.classList.contains("modal"))return;const a=b?b.dataset.fm:"later";if(a==="add"){const inp=ov.querySelector("[data-jfin]");if(inp)inp.addEventListener("change",()=>setTimeout(()=>{ov.innerHTML=""},50),{once:true});return}ov.innerHTML="";
    if(a==="undo")undo()}}
document.addEventListener("click",e=>{const b=e.target.closest("[data-rtog]");if(!b)return;e.preventDefault();e.stopPropagation();const v=S.vehicles.find(x=>x.id===b.dataset.v);if(!v||v.demo)return;const r=(v.journal||[]).find(x=>x.id===b.dataset.rtog);if(!r)return;r.fait=!r.fait;persistVehicle(v,true);const y0=window.scrollY;render();window.scrollTo(0,y0);
  if(r.fait)faitModal(v,r,()=>{r.fait=false;persistVehicle(v,true);const y1=window.scrollY;render();window.scrollTo(0,y1)});else toast("Rappel remis à faire.")},true);
document.addEventListener("click",e=>{const b=e.target.closest("[data-fold],[data-foldall]");if(!b)return;e.preventDefault();
  if(b.dataset.foldall){const all=[...document.querySelectorAll("[data-fold]")].map(x=>+x.dataset.fold);foldSet(foldGet().length>=all.length?[]:all)}
  else{const n=+b.dataset.fold,f=foldGet();foldSet(f.includes(n)?f.filter(x=>x!==n):[...f,n]);}
  foldApply();if(!b.dataset.foldall){const c=b.closest(".card");if(c&&c.getBoundingClientRect().top<70)c.scrollIntoView({block:"start"})}});
document.addEventListener("click",e=>{const b=e.target.closest("[data-jfact]");if(!b)return;e.preventDefault();const v=curVeh(route().id);if(v)pickFacture(v,b.dataset.jfact)});
document.addEventListener("change",e=>{const t=e.target;if(!t.dataset||t.dataset.docin===undefined||!t.files||!t.files.length)return;const v=S.vehicles.find(x=>x.id===t.dataset.v);if(v&&!v.demo)addFactures(v,[...t.files],null,t.dataset.docin==="garage",["autre","contrat"].includes(t.dataset.docin)?t.dataset.docin:null);t.value=""});
document.addEventListener("change",e=>{const t=e.target;if(!t.dataset||t.dataset.jfin===undefined||!t.files||!t.files.length)return;const v=S.vehicles.find(x=>x.id===t.dataset.v);if(v&&!v.demo)addFactures(v,[...t.files],t.dataset.jfin);t.value=""});
document.addEventListener("change",e=>{const t=e.target;if(t.id!=="factinput"||!t.files||!t.files.length)return;const v=curVeh(route().id);if(v&&!v.demo)addFactures(v,[...t.files]);t.value=""});
document.addEventListener("click",async e=>{const o=e.target.closest("[data-factopen],[data-factdel]");if(!o)return;const v=curVeh(route().id);if(!v)return;const L=factCache[v.id]||[];
  if(o.dataset.factopen){const f=L.find(x=>x.id===o.dataset.factopen);if(f)openFacture(f);return}
  e.preventDefault();e.stopPropagation();const id=o.dataset.factdel;modal("Supprimer ce document ?","Le fichier importé sera supprimé de cette voiture.","Supprimer",async()=>{try{await deletePhoto(id)}catch(err){toast("Suppression impossible.");return}factCache[v.id]=(factCache[v.id]||[]).filter(x=>x.id!==id);refreshFacts(v);toast("Document supprimé.")})});
document.addEventListener("change",async e=>{const t=e.target;if(!t.dataset||!t.dataset.fgin||!t.files||!t.files.length)return;const fid=t.dataset.fgin,files=[...t.files];t.value="";let ok=0;
  for(const f of files){try{let p;const base={id:newId(),vehicleId:"__fg",fgId:fid,kind:"facture",createdAt:Date.now()};
    if(f.type==="application/pdf"){if(f.size>700000){toast("PDF trop lourd (max 700 Ko). Prends plutôt une photo de la facture.");continue}p={...base,mime:"application/pdf",name:f.name,full:await fileData(f)}}
    else{const img=await loadImg(f);p={...base,mime:"image/jpeg",name:f.name||"Facture",full:shrink(img,2200,0.85),thumb:shrink(img,200,0.7)}}
    await savePhoto(p);(fgFiles=fgFiles||[]).push(p);ok++}catch(err){toast("La facture n'a pas pu être ajoutée.")}}
  refreshFgFiles();if(ok)toast(ok>1?ok+" factures ajoutées.":"Facture ajoutée.")});
document.addEventListener("click",e=>{const b=e.target.closest("[data-vtype]");if(!b)return;e.preventDefault();const v=curVeh(route().id);if(!v||v.demo)return;const t=b.dataset.vtype;if((v.vendeurType||"part")===t)return;v.vendeurType=t;persistVehicle(v,true);const y0=scrollY;render();scrollTo(0,y0)},true);
document.addEventListener("click",e=>{const o=e.target.closest("[data-fgopen],[data-fgfdel]");if(!o)return;e.preventDefault();e.stopPropagation();
  if(o.dataset.fgopen){const f=(fgFiles||[]).find(x=>x.id===o.dataset.fgopen);if(f)openFacture(f);return}
  const id=o.dataset.fgfdel;modal("Supprimer cette facture ?","Le fichier sera retiré de cette dépense.","Supprimer",async()=>{try{await deletePhoto(id)}catch(err){toast("Suppression impossible.");return}fgFiles=(fgFiles||[]).filter(x=>x.id!==id);refreshFgFiles();toast("Facture supprimée.")})},true);
document.addEventListener("click",e=>{const b=e.target.closest("[data-dismiss]");if(!b)return;e.preventDefault();e.stopPropagation();const k=b.dataset.dismiss;const h=S.settings.hiddenAlerts||[];if(!h.includes(k))S.settings.hiddenAlerts=[...h,k].slice(-300);persistSettings();const y0=window.scrollY;render();window.scrollTo(0,y0);
  toast("Rappel supprimé de l'accueil.",()=>{S.settings.hiddenAlerts=(S.settings.hiddenAlerts||[]).filter(x=>x!==k);persistSettings();const y1=window.scrollY;render();window.scrollTo(0,y1)})},true);
document.addEventListener("click",e=>{const b=e.target.closest("[data-docdel]");if(!b)return;e.preventDefault();e.stopPropagation();const v=curVeh(route().id);if(!v)return;const k=b.dataset.docdel,st=S.settings;
  const purge=async cat=>{for(const f of (factCache[v.id]||[]).filter(x=>x.cat===cat)){try{await deletePhoto(f.id)}catch(_){}}factCache[v.id]=(factCache[v.id]||[]).filter(x=>x.cat!==cat)};
  if(k==="bdc"){const n=v.bdcNum;modal("Supprimer le bon de commande n° "+n+" ?","Le bon et sa copie importée seront supprimés. Si tu en refais un, il recevra un nouveau numéro.","Supprimer",async()=>{await purge("bdc");const last=String(new Date().getFullYear()).slice(2)+"-"+String(num(st.bdcSeq)).padStart(4,"0");if(n===last){st.bdcSeq=Math.max(0,num(st.bdcSeq)-1);persistSettings()}v.bdcNum=null;v.bdcDate=null;persistVehicle(v,true);refreshFacts(v);toast("Bon de commande supprimé.")})}
  else if(k==="fact"){const n=v.factNum,last="F"+String(new Date().getFullYear()).slice(2)+"-"+String(num(st.factSeq)).padStart(4,"0"),isLast=n===last;
    modal("Supprimer la facture "+n+" ?",isLast?"C'est ta dernière facture : son numéro sera réutilisé pour la prochaine, sans trou dans la numérotation.":"Attention : ce n'est pas ta dernière facture. Son numéro restera vide dans ta numérotation ; pour une facture déjà remise au client, ton comptable préférera une note de crédit.","Supprimer",async()=>{await purge("facturev");if(isLast){st.factSeq=Math.max(0,num(st.factSeq)-1);persistSettings()}v.factNum=null;v.factDate=null;if(v.check)v.check.facture=false;persistVehicle(v,true);refreshFacts(v);toast("Facture supprimée.")})}},true);
document.addEventListener("click",e=>{const b=e.target.closest("[data-cl],[data-clall]");if(!b)return;e.preventDefault();const v=curVeh(route().id);if(!v||v.demo)return;v.checklist=v.checklist||{};
  if(b.dataset.clall!==undefined){const s=b.dataset.clall;v.checklist={};if(s)for(let i=1;i<=CL_TOTAL;i++)v.checklist[i]=s}else{const k=b.dataset.cl,s=b.dataset.s;v.checklist[k]=v.checklist[k]===s?"":s}
  persistVehicle(v);const box=b.closest(".clbox");if(box){const open=[...box.querySelectorAll("details.clg")].map(d=>d.open);box.outerHTML=clHtml(v,true);const nb=document.querySelector(".clbox");if(nb)nb.querySelectorAll("details.clg").forEach((d,i)=>d.open=open[i])}});
document.addEventListener("toggle",e=>{const d=e.target;if(d.classList&&d.classList.contains("bp")&&d.open){const i=d.querySelector("[data-bsearch]");if(i)setTimeout(()=>i.focus(),30)}if(d.dataset&&d.dataset.dd==="vopt"){S.vOpen=d.open;return}if(d.dataset&&d.dataset.dd==="vfrais"){S.vfOpen=d.open;return}if(d.dataset&&d.dataset.dd&&S.sim){S.sim.open=S.sim.open||{};S.sim.open[d.dataset.dd]=d.open}},true);
let installEvt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;if(route().view==="reglages"&&!editing())render()});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{}));
boot();
})();
