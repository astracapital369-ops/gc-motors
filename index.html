  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0a0a; --surface:#151515; --surface-2:#1f1f1f; --line:#2e2e2e;
  --ink:#eeeeee; --muted:#9a9a9a; --accent:#ffffff; --accent-ink:#000000; --brand:#000000; --brand-ink:#ffffff; --accent-soft:#262626;
  --good:#4cc283; --good-soft:#15291e; --warn:#e8a83a; --warn-soft:#2c2212; --bad:#ff7b6e; --bad-soft:#331a18; color-scheme:dark;}}
:root[data-theme="dark"]{

.calc .row{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.calc .row span:first-child{color:var(--muted)}
.calc .total{border-top:1px solid var(--line);padding-top:8px;margin-top:4px;font-weight:600;font-size:16px}
.calc .big{font-family:var(--display);font-size:36px;font-weight:600;line-height:1}
.frais{width:100%;border-collapse:collapse;font-size:14px}
.frais td,.frais th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.frais th{font-size:12px;color:var(--muted);font-weight:500}
.frais input,.frais select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.x{border:none;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:4px 6px}
.x:hover{color:var(--bad)}
.check{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px}
.check label{display:flex;gap:8px;align-items:center;font-size:14px;padding:4px 0;cursor:pointer}
.check input{width:17px;height:17px;accent-color:var(--accent)}
.check h3{grid-column:1/-1;font-size:14px;color:var(--muted);font-family:var(--body);font-weight:600;margin-top:8px;text-transform:uppercase;letter-spacing:.05em}
.fiche{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px}
.sticky{position:sticky;top:16px}
.est{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.est div{background:var(--surface-2);border-radius:8px;padding:8px}
.est small{display:block;color:var(--muted);font-size:12px}
.est b{font-family:var(--display);font-size:22px}
.note{font-size:12.5px;color:var(--muted)}
.tablewrap{overflow-x:auto}
table.data{width:100%;border-collapse:collapse;font-size:14px;min-width:720px}
table.data th,table.data td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.data th:first-child,table.data td:first-child{text-align:left}
table.data th{font-size:12px;color:var(--muted);font-weight:500}
table.data tfoot td{font-weight:600;border-top:2px solid var(--line)}
table.data a{color:var(--ink);font-weight:500}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--body)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));z-index:50;overscroll-behavior:contain;overflow:hidden;touch-action:none}
.modal .card{max-width:440px;width:100%;max-height:100%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;box-sizing:border-box}
.modal .card *{max-width:100%;box-sizing:border-box}.modal input,.modal select,.modal textarea{min-width:0;width:100%}.modal input[type=checkbox],.modal input[type=radio]{width:auto}
html.lock,html.lock body{overflow:hidden!important;overscroll-behavior:none}body.lockfix{position:fixed;left:0;right:0;width:100%}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;max-width:90vw}
nav.tabs{display:none}
@media (max-width:760px){.install{grid-template-columns:1fr}}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
@media (max-width:980px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.two,.fiche{grid-template-columns:1fr}.sticky{position:static}.fiche .sticky{order:-1}}
@media (max-width:760px){
  .shell{grid-template-columns:minmax(0,1fr)}
  nav.side{display:none}
  .mbar{display:flex;align-items:center;justify-content:center;gap:10px;position:sticky;top:0;z-index:30;background:var(--brand);color:var(--brand-ink);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top))}
  .mbar svg{width:32px;height:32px;border-radius:8px}
  .mbar .wm{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.02em;line-height:1}
  .mbar .wm em{font-style:normal;color:rgba(255,255,255,.62)}
  .mbar .wm span{font:600 10px var(--body);letter-spacing:.28em;opacity:.7;margin-left:6px}
  main{padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
  nav.tabs{display:grid;grid-template-columns:repeat(7,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:40}
  nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9.5px;white-space:nowrap;color:var(--muted);text-decoration:none;padding:4px 0}
  nav.tabs a svg{width:22px;height:22px}
  nav.tabs a.on{color:var(--accent)}
  .form,.check{grid-template-columns:1fr}
  .pipeline{grid-template-columns:repeat(2,minmax(0,1fr))}
  h1{font-size:26px}
  .kpi .val{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.doc.dossv{border:1.5px solid var(--acc,#2f7bff);background:linear-gradient(180deg,rgba(47,123,255,.08),transparent)}.doc.dossv .dico{background:var(--acc,#2f7bff);color:#fff}
.dosvb{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}.dosvb .fico.s{font-size:9px}

const S={vehicles:[],settings:{...DEF_SETTINGS},mode:"loading",loaded:false,garageFilter:"stock",search:"",sim:null,simEst:null,simBusy:false,estBusy:false};
let db=null,uid=null,vehCol=null,setRef=null,sample=null;
const chains={},timers={},goers={};
const isDb=()=>!!vehCol&&/^db/.test(S.mode||"");
/* journal local des modifications pas encore confirmées par le serveur : survit à la fermeture de l'app */
let PEND={veh:{},del:{},settings:null};
const pendKey=()=>"gc-pending-"+(uid||"x");
function pendLoad(){try{const d=JSON.parse(localStorage.getItem(pendKey())||"null");PEND={veh:{},del:{},settings:null,...(d||{})}}catch(e){PEND={veh:{},del:{},settings:null}}}
function pendSave(){try{localStorage.setItem(pendKey(),JSON.stringify(PEND))}catch(e){try{const t={...PEND,veh:{}};Object.entries(PEND.veh).forEach(([k,v])=>{const c={...v};delete c.cover;t.veh[k]=c});localStorage.setItem(pendKey(),JSON.stringify(t))}catch(_){}}}
function flushAll(){Object.keys(goers).forEach(id=>{clearTimeout(timers[id]);const g=goers[id];delete goers[id];try{g()}catch(e){}});if(setTimer){clearTimeout(setTimer);setTimer=null;try{settingsGo()}catch(e){}}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")flushAll()});
window.addEventListener("pagehide",flushAll);

/* ---------- utilitaires ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtE=new Intl.NumberFormat("fr-BE",{style:"currency",currency:"EUR",maximumFractionDigits:0}),fmtE2=new Intl.NumberFormat("fr-BE",{style:"currency",currency:"EUR",minimumFractionDigits:2,maximumFractionDigits:2});
const eur=n=>{if(n==null||isNaN(n))return"—";const c=Math.round(n*100)/100;return Number.isInteger(c)?fmtE.format(c):fmtE2.format(c)};
const num=v=>{const n=parseFloat(String(v??"").replace(",","."));return isNaN(n)?0:n};
const numOrNull=v=>{if(v===""||v==null)return null;const n=parseFloat(String(v).replace(",","."));return isNaN(n)?null:n};
const today=()=>new Date().toISOString().slice(0,10);
const daysBetween=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const aVenir=(e,v)=>{if(!e.date||e.type==="Statut")return"";if(e.fait)return'<button type="button" class="avenir ok" data-rtog="'+e.id+'" data-v="'+v.id+'" title="Annuler">Fait · annuler</button>';if(e.date<today())return"";const d=daysBetween(today(),e.date);return'<span class="avenir">À venir · '+(d===0?"aujourd'hui":d===1?"demain":"dans "+d+" j")+'</span>'+(v.demo?'':'<button type="button" class="avenir mk" data-rtog="'+e.id+'" data-v="'+v.id+'">Marquer fait</button>')};
let FOLDF=null,FOLDD=null;
const foldGet=()=>FOLDF||(FOLDF=[2,3,4,5,6,7,8]);
const foldSet=a=>{FOLDF=a};
window.addEventListener("hashchange",()=>{FOLDF=null;FOLDD=null});
function foldApply(){const f=foldGet();document.querySelectorAll("[data-fold]").forEach(b=>{const n=+b.dataset.fold,c=b.closest(".card");if(!c)return;const on=f.includes(n);c.classList.toggle("folded",on);b.setAttribute("aria-expanded",String(!on))});const a=document.querySelector("[data-foldall]");if(a)a.textContent=f.length>=document.querySelectorAll("[data-fold]").length?"Tout ouvrir":"Tout réduire"}
function suiviList(v){const L=(v.journal||[]).filter(e=>e.type!=="Statut");

function migrateFrais(v){let ch=false;v.journal=v.journal||[];(v.frais||[]).forEach(f=>{if(f.j&&v.journal.some(e=>e.id===f.j))return;if(!num(f.montant)&&!f.libelle)return;const e={id:newId(),t:Date.now(),date:v.dateAchat||today(),type:CAT2TYPE[f.cat]||"Autre",texte:f.libelle||"",montant:num(f.montant)||""};v.journal.push(e);f.j=e.id;ch=true});if(ch)v.frais=[];return ch}

function annonceTxt(v){
  const st=S.settings,f=n=>new Intl.NumberFormat("fr-BE").format(n);const ch=num(v.puissance)?Math.round(num(v.puissance)*1.35962):0;

  const it=[];
  if(v.premiereImmat)it.push("1re immatriculation : "+moisAn(v.premiereImmat));else if(v.annee)it.push("Année : "+v.annee);
  if(v.km)it.push("Kilométrage : "+f(num(v.km))+" km (Car-Pass)");
  if(v.carburant)it.push("Carburant : "+v.carburant);if(v.boite)it.push("Boîte : "+v.boite.toLowerCase());

  if(v.euronorm)it.push("Norme : "+v.euronorm);if(v.couleur)it.push("Couleur : "+v.couleur);

  if(v.entretien!==false)it.push("Carnet d'entretien complet");if(v.proprios)it.push(v.proprios>=3?"3 propriétaires et plus":v.proprios+" propriétaire"+(v.proprios>1?"s":""));
  L.push(...it.map(x=>"- "+x));
  const opts=(v.options||[]).filter(o=>!/^(ABS|Antidémarrage|Airbags frontaux|Kit anti-crevaison)$/.test(o));
  if(opts.length){L.push("");L.push("Équipements :");opts.slice(0,30).forEach(o=>L.push("- "+o));if(opts.length>30)L.push("- et plus encore")}
  L.push("");

/* 5. Récap trimestriel pour le comptable */
function recapData(y,q){
  const a=y+"-"+String(q*3+1).padStart(2,"0")+"-01",b=y+"-"+String(q*3+3).padStart(2,"0")+"-31";const inQ=d=>d&&d>=a&&d<=b;
  const L=list().filter(v=>!v.demo);
  const ventes=L.filter(v=>v.statut==="vendu"&&inQ(v.dateVente)).map(v=>{const c=calc(v);return{v,prix:num(v.prixVente),achat:num(v.prixAchat),frais:fraisTotal(v),marge:num(v.prixVente)-num(v.prixAchat)-fraisTotal(v),tva:c.tva||0}});
  const achats=L.filter(v=>inQ(v.dateAchat)).map(v=>({v,prix:num(v.prixAchat)}));
  const fraisV=[];L.forEach(v=>fraisJ(v).forEach(e=>{if(inQ(e.date))fraisV.push({v,e})}));
  const fg=fgList().filter(f=>inQ(f.date));
  const T={ca:ventes.reduce((s,x)=>s+x.prix,0),marge:ventes.reduce((s,x)=>s+x.marge,0),tva:ventes.reduce((s,x)=>s+x.tva,0),achats:achats.reduce((s,x)=>s+x.prix,0),fraisV:fraisV.reduce((s,x)=>s+num(x.e.montant),0),fg:fg.reduce((s,f)=>s+num(f.montant),0)};
  const det=detList().filter(x=>inQ(x.date));T.detHT=det.reduce((s2,x)=>s2+detTot(x).ht,0);T.detTVA=det.reduce((s2,x)=>s2+detTot(x).tva,0);
  T.res=T.marge-T.tva-T.fg+T.detHT;return{a,b,ventes,achats,fraisV,fg,det,T};
}

function vTableau(){

  const per=(pm!==""?MOIS[+pm].toLowerCase()+" ":"")+y;

function chartMois(vendus,yr,sel){
  const months=[];
  for(let i=0;i<12;i++){months.push({k:yr+"-"+String(i+1).padStart(2,"0"),l:MOIS[i].slice(0,3).toLowerCase(),v:0})}
  vendus.forEach(v=>{if(!v.dateVente)return;const m=months.find(x=>x.k===v.dateVente.slice(0,7));if(m)m.v+=num(v.prixVente)-num(v.prixAchat)-fraisTotal(v)});
  months.forEach(m=>{m.v-=fgTotal(m.k)});
  const W=560,H=210,pl=46,pr=8,pt=12,pb=26,cw=(W-pl-pr)/12;
  let max=Math.max(0,...months.map(m=>m.v)),min=Math.min(0,...months.map(m=>m.v));
  if(max===0&&min===0)max=1000;
  const step=niceStep((max-min)/4);max=Math.ceil(max/step)*step;min=Math.floor(min/step)*step;
  const y=v=>pt+(max-v)/(max-min)*(H-pt-pb);
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Bénéfice net par mois sur 12 mois">';
  for(let t=min;t<=max+1e-6;t+=step){s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(t)+'" y2="'+y(t)+'" stroke="var(--line)" stroke-width="'+(t===0?1.4:.7)+'"/><text x="'+(pl-6)+'" y="'+(y(t)+4)+'" text-anchor="end">'+shortE(t)+'</text>'}
  months.forEach((m,i)=>{const x=pl+i*cw+cw*.18,w=cw*.64,y0=y(0),y1=y(m.v);
    const on=String(sel)===String(i),dim=sel!==""&&!on;
    if(on)s+='<rect x="'+(pl+i*cw+2)+'" y="'+pt+'" width="'+(cw-4)+'" height="'+(H-pt-pb)+'" rx="4" fill="var(--accent-soft)"/>';
    if(m.v!==0)s+='<rect x="'+x+'" y="'+Math.min(y0,y1)+'" width="'+w+'" height="'+Math.max(1.5,Math.abs(y1-y0))+'" rx="2.5" fill="'+(m.v<0?"var(--bad)":"var(--accent)")+'" opacity="'+(dim?.35:1)+'"><title>'+MOIS[i]+" : "+eur(m.v)+'</title></rect>';
    if(on&&m.v!==0)s+='<text x="'+(pl+i*cw+cw/2)+'" y="'+(Math.min(y0,y1)-5)+'" text-anchor="middle" style="fill:var(--ink);font-weight:600">'+shortE(m.v)+'</text>';
    s+='<text x="'+(pl+i*cw+cw/2)+'" y="'+(H-8)+'" text-anchor="middle"'+(on?' style="fill:var(--accent);font-weight:600"':"")+'>'+m.l+'</text>';
    s+='<rect x="'+(pl+i*cw)+'" y="0" width="'+cw+'" height="'+H+'" fill="transparent" style="cursor:pointer" data-month="'+i+'"><title>'+MOIS[i]+'</title></rect>'});
  return s+'</svg>';
}
function niceStep(r){const p=Math.pow(10,Math.floor(Math.log10(r||1)));const n=r/p;return(n<=1?1:n<=2?2:n<=5?5:10)*p}
function shortE(n){return Math.abs(n)>=1000?(n/1000).toLocaleString("fr-BE",{maximumFractionDigits:1})+" k€":eur(n)}

  if(c.ref==null){h+='<p class="note">Indique un prix affiché ou lance une estimation pour voir la marge.</p>'+row("Coût total (achat + frais)",eur(c.cout))}

    row("TVA sur la marge ("+S.settings.tva+"/"+(100+S.settings.tva)+")","− "+eur(c.tva))+row("Frais","− "+eur(c.frais))+
    '<div class="row total"><span>Reste avant impôt</span><span class="num">'+eur(c.net)+'</span></div>';
  }
  const j=joursStock(v);if(j!=null)h+=row(v.statut==="vendu"?"Durée en stock":"En stock depuis",j+" jours");
  box.innerHTML=h+'</div>';
  const mb=$("#maxbox");if(mb){const rev=num(v.prixAffiche)||(v.estim&&num(v.estim.median))||0;
    if(!rev)mb.innerHTML='<p class="note">Besoin d\'un prix de revente (affiché ou estimé).</p>';

}

const ETATS=[["excellent","Excellent","Comme neuve, aucun défaut",1.06],["bon","Bon","Petites traces d'usage",1],["moyen","Moyen","Rayures, usure visible",0.9],["rafraichir","À rafraîchir","Gros défauts ou travaux",0.78]];
function catMatch(marque,modele){
  const norm=x=>String(x||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g,"");
  const bk=Object.keys(CATALOGUE).find(b=>norm(b)===norm(marque)||(norm(marque).length>2&&norm(b).startsWith(norm(marque))));
  if(!bk)return null;
  const mm=norm(modele);let best=null;
  for(const k of Object.keys(CATALOGUE[bk].m)){for(const part of k.split("/")){const p=norm(part);if(p&&mm.startsWith(p)&&(!best||p.length>best.l))best={k,l:p.length}}}
  return best?{brand:bk,model:best.k}:{brand:bk,model:null};
}

// correction mesurée sur annonces de pros belges : [rapport à 5 ans, rapport à 10 ans]
const CALIB={"Volkswagen|Golf":[1.0,1.06],"Volkswagen|Polo":[1.07,1.17],"Peugeot|208":[1.01,1.01]};
const DECOTE_MODELE={"Ford|Mustang":0.075,"Ford|Ranger":0.07,"Chevrolet|Camaro":0.075,"Chevrolet|Corvette":0.07,"Dodge|Challenger":0.075,
  "Porsche|911":0.045,"Porsche|Boxster / 718 Boxster":0.06,"Porsche|Cayman / 718 Cayman":0.06,"Toyota|Land Cruiser":0.055,"Toyota|Hilux":0.06,
  "Toyota|GT86 / GR86":0.065,"Toyota|Supra":0.065,"Jeep|Wrangler":0.06,"Mercedes|Classe G":0.045,"Land Rover|Defender":0.065,"Mazda|MX-5":0.065,"Suzuki|Jimny":0.045};
function estimer(o){
  // o : {brand, model, prixNeuf?, annee, km, carburant, boite, etat, options[], entretien, proprios}
  const b=CATALOGUE[o.brand],mdl=b&&b.m[o.model];
  const neuf=num(o.prixNeuf)||(mdl?mdl[0]:0);if(!neuf)return null;
  const cls=b?b.r:2,seg=mdl?mdl[1]:2;
  const yNow=new Date().getFullYear(),age=Math.max(0,yNow-num(o.annee||yNow));
  const d=DECOTE_MODELE[o.brand+"|"+o.model]??{1:0.075,2:0.092,3:0.108}[cls];
  let v=neuf*(age<1?0.88:0.82*Math.pow(1-d,age-1));
  v*=1.18; // hausse des prix de l'occasion depuis 2021
  const attendu=Math.max(1,age)*15000,km=num(o.km);
  v*=Math.min(1.15,Math.max(0.65,1-(km-attendu)/10000*0.025));
  const yr=num(o.annee);
  v*={"Essence":1,"Diesel":yr>=2018?0.97:0.88,"Hybride":1.08,"Électrique":0.9,"GPL":0.86}[o.carburant]||1;
  v*=num(o.coef)||1;
  {const cb=CALIB[o.brand+"|"+o.model];if(cb){const t=Math.max(-0.6,Math.min(1.6,(age-5)/5));v*=cb[0]*Math.pow(cb[1]/cb[0],t)}}
  if(o.boite==="Automatique")v*=seg>=3&&neuf<20000?1.03:1.06;
  v*=(ETATS.find(e=>e[0]===o.etat)||ETATS[1])[3];
  if(o.entretien===false)v*=0.92;
  if(num(o.proprios)>=3)v*=0.95;
  v*=1+Math.min(10,(o.options||[]).reduce((a,l)=>a+(EQ_POIDS[l]!=null?EQ_POIDS[l]:0.5),0))/100;
  v=Math.max(900,v);
  const spread=0.08+Math.min(0.08,age*0.005);
  const r=x=>Math.round(x/50)*50;
  const demande=Math.max(1,Math.min(3,seg-(age>14?1:0)-(km>220000?1:0)));
  return{bas:r(v*(1-spread)),median:r(v),haut:r(v*(1+spread)),demande,delai:{3:"15-30",2:"30-45",1:"45-75"}[demande],neuf,age,catalogue:!!mdl};
}

function simReady(s){return s.brand==="Autre"?num(s.prixNeuf)>0:!!(s.brand&&s.model)}
function kmLab(s){const f=n=>new Intl.NumberFormat("fr-BE").format(n);return s.kmMin===s.kmMax?f(s.kmMin)+" km":f(s.kmMin)+" à "+f(s.kmMax)+" km"}
function simInput(s,annee,km){return{brand:s.brand,model:s.model,prixNeuf:s.brand==="Autre"?s.prixNeuf:"",annee,km:km==null?Math.round((s.kmMin+s.kmMax)/2):km,carburant:s.carburant,coef:s.coef,boite:s.boite,etat:s.etat,options:s.options,entretien:s.entretien,proprios:s.proprios}}
function estimerSim(s){const a=Math.min(s.anneeMin,s.anneeMax),z=Math.max(s.anneeMin,s.anneeMax),lo=estimer(simInput(s,a,s.kmMax)),hi=estimer(simInput(s,z,s.kmMin)),mid=estimer(simInput(s,Math.round((a+z)/2)));if(!lo||!hi||!mid)return null;return{bas:Math.min(lo.bas,mid.bas),median:mid.median,haut:Math.max(hi.haut,mid.haut),demande:mid.demande,delai:mid.delai}}
function simRefresh(){const s=S.sim;if(s.result&&simReady(s))s.result=estimerSim(s);const a=$("#dd-options"),b=$("#dd-frais"),t=$("#fraistotal");if(a)a.textContent=ddSummary("options");if(b)b.textContent=ddSummary("frais");if(t)t.textContent=eur(fraisSim(s));updateSim()}
function simResult(){
  const s=S.sim,r0=s.result;
  if(!r0)return'<h2>Résultat</h2><p class="note">Remplis les étapes puis touche <b>Simuler</b>. Tu obtiendras le prix de revente minimum, médian et maximum, et le prix maximum à payer.</p>';
  const vend="pro";
  const sc=(x,f)=>({bas:Math.round(x.bas*f/50)*50,median:Math.round(x.median*f/50)*50,haut:Math.round(x.haut*f/50)*50,demande:x.demande,delai:x.delai});
  const rPart=sc(r0,VENDEUR_PART),r=vend==="part"?rPart:r0;
  const fr=fraisSim(s),t=S.settings.tva,mg=num(S.settings.margeVisee);
  const maxFor=(rev,pro)=>pro?prixAchatMax(rev,fr,mg,t):rev-fr-mg;
  const ya=Math.min(s.anneeMin,s.anneeMax),yz=Math.max(s.anneeMin,s.anneeMax),yLab=ya===yz?String(ya):ya+" à "+yz;
  const isPro=vend!=="part";
  const maxMed=maxFor(r.median,isPro),maxBas=maxFor(r.bas,isPro);
  const offre=Math.round(Math.min(maxBas,maxMed*0.9)/50)*50;
  const lo=vend==="both"?rPart.bas:r.bas,hi=r.haut;
  const pos=x=>Math.max(0,Math.min(100,(x-lo*0.9)/(hi*1.1-lo*0.9)*100));
  const nom=s.brand==="Autre"?(s.libre||"Véhicule"):s.brand+" "+s.model;
  const nbPb=Object.keys(s.frais).filter(k=>PB_INDEX[k]&&PB_INDEX[k].g!=="Préparation à la vente").length;
  const grid=(title,x)=>'<div class="note" style="margin-top:12px;font-weight:600;color:var(--ink)">'+title+'</div><div class="est num" style="margin-top:6px"><div><small>Minimum</small><b>'+eur(x.bas)+'</b></div><div class="mid"><small>Médian</small><b>'+eur(x.median)+'</b></div><div><small>Maximum</small><b>'+eur(x.haut)+'</b></div></div>';
  const bar=x=>'<div class="range"><i style="left:'+pos(x.bas)+'%;right:'+(100-pos(x.haut))+'%"></i><span style="left:'+pos(x.median)+'%"></span></div>';
  let h='<h2>'+esc(nom)+' · '+yLab+'</h2><p class="note num">'+(s.moteur?esc(s.moteur)+' · '+esc(s.carburant)+' · ':(s.brand!=="Autre"?'Toutes motorisations · ':esc(s.carburant)+' · '))+kmLab(s)+' · '+esc(s.boite)+(s.options.length?' · '+s.options.length+' équipement'+(s.options.length>1?"s":""):"")+'</p>';
  const suffix=nbPb?" (après réparations)":"";
  if(vend==="both"){h+=grid("Revente par un professionnel, avec garantie"+suffix,r0)+bar(r0)+grid("Revente entre particuliers"+suffix,rPart)+bar(rPart)}
  else h+=grid((vend==="part"?"Revente entre particuliers":"Prix de revente estimé")+suffix,r)+bar(r);
  h+='<div class="calc" style="margin-top:6px">'+row("Demande sur le marché",["","Plus lente","Correcte","Forte"][r.demande])+row("Délai de vente probable",r.delai+" jours")+'</div>';
  h+='<div class="buybox"><small>Prix d\'achat maximum'+(vend==="both"?" (revente pro)":"")+'</small><div class="big num">'+eur(maxMed)+'</div><div class="note">pour revendre au prix médian avec '+eur(mg)+' de marge nette'+(isPro?", TVA sur la marge comprise":"")+' (marge réglable dans Réglages)</div>'+
     '<div class="calc" style="margin-top:10px">'+row("Scénario prudent (revente au minimum)",eur(maxBas))+(vend==="both"?row("Si tu revends entre particuliers",eur(maxFor(rPart.median,false))):"")+row("Première offre conseillée",eur(offre))+(fr?row("Frais prévus",eur(fr)):"")+'</div></div>';
  h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><a class="btn small" href="'+asUrl({marque:s.brand==="Autre"?(s.libre||""):s.brand,modele:s.brand==="Autre"?"":s.model,annee:Math.round((s.anneeMin+s.anneeMax)/2)})+'" target="_blank" rel="noopener">Comparer sur AutoScout24</a><a class="btn small" href="'+dmUrl({marque:s.brand==="Autre"?(s.libre||""):s.brand,modele:s.brand==="Autre"?"":s.model})+'" target="_blank" rel="noopener">2ememain</a></div>';
  h+='<button class="btn primary" style="margin-top:12px;width:100%;justify-content:center" data-act="simsave">Ajouter au garage</button>';
  h+='<p class="note" style="margin-top:10px">Estimation calculée par l\'app (prix neuf de référence, âge, kilométrage, état). Elle ne lit pas les annonces : vérifie toujours avec 3 ou 4 annonces comparables avant d\'acheter.</p>';
  return h;
}

async function estimate(v){
  const prompt="Tu es un expert du marché belge des voitures d'occasion. Nous sommes le "+new Date().toLocaleDateString("fr-BE")+". Estime le prix de vente réaliste en Belgique de cette voiture, vendue par un petit négociant professionnel avec garantie 12 mois et contrôle technique fait.\n"+
    "Véhicule : "+[v.marque,v.modele].join(" ")+", année "+(v.annee||"inconnue")+", "+(v.km?v.km+" km":"kilométrage inconnu")+", "+(v.carburant||"")+", boîte "+(v.boite||"")+".\n"+
    "Réponds UNIQUEMENT avec un objet JSON, sans texte autour : {\"bas\":entier,\"median\":entier,\"haut\":entier,\"delai\":\"fourchette de jours pour vendre, ex 15-30\",\"commentaire\":\"une phrase en français sur la demande et les points à vérifier pour ce modèle\"}. Prix en euros TTC.";
  let out=null;
  try{out=sample.json?await sample.json(prompt,{modelTier:"default"}):null}catch(e){if(e&&e.code==="not_granted"){sample=null;throw e}}
  if(!out){const r=await sample(prompt,{modelTier:"default"});const m=(r.text||"").match(/\{[\s\S]*\}/);out=m?JSON.parse(m[0]):null}
  if(!out||!num(out.median))throw new Error("format");
  return{bas:Math.round(num(out.bas)),median:Math.round(num(out.median)),haut:Math.round(num(out.haut)),delai:String(out.delai||"").slice(0,20),commentaire:String(out.commentaire||"").slice(0,240),date:today()};
}

  foldApply();if(!b.dataset.foldall){const c=b.closest(".card");if(c&&c.getBoundingClientRect().top<70)c.scrollIntoView({block:"start"})}});
document.addEventListener("click",e=>{const b=e.target.closest("[data-jfact]");if(!b)return;e.preventDefault();const v=curVeh(route().id);if(v)pickFacture(v,b.dataset.jfact)});
document.addEventListener("change",e=>{const t=e.target;if(!t.dataset||t.dataset.docin===undefined||!t.files||!t.files.length)return;const v=S.vehicles.find(x=>x.id===t.dataset.v);if(v&&!v.demo)addFactures(v,[...t.files],null,t.dataset.docin==="garage",["autre","contrat"].includes(t.dataset.docin)?t.dataset.docin:null);t.value=""});
document.addEventListener("change",e=>{const t=e.target;if(!t.dataset||t.dataset.jfin===undefined||!t.files||!t.files.length)return;const v=S.vehicles.find(x=>x.id===t.dataset.v);if(v&&!v.demo)addFactures(v,[...t.files],t.dataset.jfin);t.value=""});
document.addEventListener("change",e=>{const t=e.target;if(t.id!=="factinput"||!t.files||!t.files.length)return;const v=curVeh(route().id);if(v&&!v.demo)addFactures(v,[...t.files]);t.value=""});
document.addEventListener("click",async e=>{const o=e.target.closest("[data-factopen],[data-factdel]");if(!o)return;const v=curVeh(route().id);if(!v)return;const L=factCache[v.id]||[];
  if(o.dataset.factopen){const f=L.find(x=>x.id===o.dataset.factopen);if(f)openFacture(f);return}
  e.preventDefault();e.stopPropagation();const id=o.dataset.factdel;modal("Supprimer ce document ?","Le fichier importé sera supprimé de cette voiture.","Supprimer",async()=>{try{await deletePhoto(id)}catch(err){toast("Suppression impossible.");return}factCache[v.id]=(factCache[v.id]||[]).filter(x=>x.id!==id);refreshFacts(v);toast("Document supprimé.")})});
document.addEventListener("change",async e=>{const t=e.target;if(!t.dataset||!t.dataset.fgin||!t.files||!t.files.length)return;const fid=t.dataset.fgin,files=[...t.files];t.value="";let ok=0;
  for(const f of files){try{let p;const base={id:newId(),vehicleId:"__fg",fgId:fid,kind:"facture",createdAt:Date.now()};
    if(f.type==="application/pdf"){if(f.size>700000){toast("PDF trop lourd (max 700 Ko). Prends plutôt une photo de la facture.");continue}p={...base,mime:"application/pdf",name:f.name,full:await fileData(f)}}
    else{const img=await loadImg(f);p={...base,mime:"image/jpeg",name:f.name||"Facture",full:shrink(img,2200,0.85),thumb:shrink(img,200,0.7)}}
    await savePhoto(p);(fgFiles=fgFiles||[]).push(p);ok++}catch(err){toast("La facture n'a pas pu être ajoutée.")}}
  refreshFgFiles();if(ok)toast(ok>1?ok+" factures ajoutées.":"Facture ajoutée.")});
document.addEventListener("click",e=>{const b=e.target.closest("[data-vtype]");if(!b)return;e.preventDefault();const v=curVeh(route().id);if(!v||v.demo)return;const t=b.dataset.vtype;if((v.vendeurType||"part")===t)return;v.vendeurType=t;persistVehicle(v,true);const y0=scrollY;render();scrollTo(0,y0)},true);
document.addEventListener("click",e=>{const o=e.target.closest("[data-fgopen],[data-fgfdel]");if(!o)return;e.preventDefault();e.stopPropagation();
  if(o.dataset.fgopen){const f=(fgFiles||[]).find(x=>x.id===o.dataset.fgopen);if(f)openFacture(f);return}
  const id=o.dataset.fgfdel;modal("Supprimer cette facture ?","Le fichier sera retiré de cette dépense.","Supprimer",async()=>{try{await deletePhoto(id)}catch(err){toast("Suppression impossible.");return}fgFiles=(fgFiles||[]).filter(x=>x.id!==id);refreshFgFiles();toast("Facture supprimée.")})},true);
document.addEventListener("click",e=>{const b=e.target.closest("[data-dismiss]");if(!b)return;e.preventDefault();e.stopPropagation();const k=b.dataset.dismiss;const h=S.settings.hiddenAlerts||[];if(!h.includes(k))S.settings.hiddenAlerts=[...h,k].slice(-300);persistSettings();const y0=window.scrollY;render();window.scrollTo(0,y0);
  toast("Rappel supprimé de l'accueil.",()=>{S.settings.hiddenAlerts=(S.settings.hiddenAlerts||[]).filter(x=>x!==k);persistSettings();const y1=window.scrollY;render();window.scrollTo(0,y1)})},true);
document.addEventListener("click",e=>{const b=e.target.closest("[data-docdel]");if(!b)return;e.preventDefault();e.stopPropagation();const v=curVeh(route().id);if(!v)return;const k=b.dataset.docdel,st=S.settings;
  const purge=async cat=>{for(const f of (factCache[v.id]||[]).filter(x=>x.cat===cat)){try{await deletePhoto(f.id)}catch(_){}}factCache[v.id]=(factCache[v.id]||[]).filter(x=>x.cat!==cat)};
  if(k==="bdc"){const n=v.bdcNum;modal("Supprimer le bon de commande n° "+n+" ?","Le bon et sa copie importée seront supprimés. Si tu en refais un, il recevra un nouveau numéro.","Supprimer",async()=>{await purge("bdc");const last=String(new Date().getFullYear()).slice(2)+"-"+String(num(st.bdcSeq)).padStart(4,"0");if(n===last){st.bdcSeq=Math.max(0,num(st.bdcSeq)-1);persistSettings()}v.bdcNum=null;v.bdcDate=null;persistVehicle(v,true);refreshFacts(v);toast("Bon de commande supprimé.")})}
  else if(k==="fact"){const n=v.factNum,last="F"+String(new Date().getFullYear()).slice(2)+"-"+String(num(st.factSeq)).padStart(4,"0"),isLast=n===last;
    modal("Supprimer la facture "+n+" ?",isLast?"C'est ta dernière facture : son numéro sera réutilisé pour la prochaine, sans trou dans la numérotation.":"Attention : ce n'est pas ta dernière facture. Son numéro restera vide dans ta numérotation ; pour une facture déjà remise au client, ton comptable préférera une note de crédit.","Supprimer",async()=>{await purge("facturev");if(isLast){st.factSeq=Math.max(0,num(st.factSeq)-1);persistSettings()}v.factNum=null;v.factDate=null;if(v.check)v.check.facture=false;persistVehicle(v,true);refreshFacts(v);toast("Facture supprimée.")})}},true);
document.addEventListener("click",e=>{const b=e.target.closest("[data-cl],[data-clall]");if(!b)return;e.preventDefault();const bx=b.closest("[data-vid]"),v=curVeh(bx?bx.dataset.vid:route().id);if(!v||v.demo)return;v.checklist=v.checklist||{};
  if(b.dataset.clall!==undefined){const s=b.dataset.clall;v.checklist={};if(s)for(let i=1;i<=CL_TOTAL;i++)v.checklist[i]=s}else{const k=b.dataset.cl,s=b.dataset.s;v.checklist[k]=v.checklist[k]===s?"":s}
  persistVehicle(v);const box=b.closest(".clbox");if(box){const open=[...box.querySelectorAll("details.clg")].map(d=>d.open);box.outerHTML=clHtml(v,true);const nb=document.querySelector(".clbox");if(nb)nb.querySelectorAll("details.clg").forEach((d,i)=>d.open=open[i])}});
document.addEventListener("toggle",e=>{const d=e.target;if(d.classList&&d.classList.contains("bp")&&d.open){const i=d.querySelector("[data-bsearch]");if(i)setTimeout(()=>i.focus(),30)}if(d.dataset&&d.dataset.dd==="vopt"){S.vOpen=d.open;return}if(d.dataset&&d.dataset.dd==="vfrais"){S.vfOpen=d.open;return}if(d.dataset&&d.dataset.dd&&S.sim){S.sim.open=S.sim.open||{};S.sim.open[d.dataset.dd]=d.open}},true);
let installEvt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;if(route().view==="reglages"&&!editing())render()});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{}));
boot();
})();

/* iOS : après la fermeture du clavier dans une fenêtre, réaligne la page pour que les touchers tombent au bon endroit */
(function(){const fix=()=>{if(document.documentElement.classList.contains("lock")&&(window.scrollY||window.pageYOffset)){window.scrollTo(0,0)}};
  document.addEventListener("focusout",e=>{if(e.target&&e.target.closest&&e.target.closest("#overlay"))setTimeout(fix,60)});
  if(window.visualViewport)window.visualViewport.addEventListener("resize",()=>setTimeout(fix,60));})();
</script>
